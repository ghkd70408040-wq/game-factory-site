<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>14차 증거 — #5 컷툰 캐스트 수리 비교컷</title>
<style>
  :root{
    --bg:#FBF6EA; --card:#FFFFFF; --ink:#3a2a22; --muted:#7a6558;
    --line:#E4D8C2; --accent:#FF6FA5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1512; --card:#241c18; --ink:#F2E7D8; --muted:#B09A88;
           --line:#3a2e26; --accent:#FF8FB8; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:16px 12px 48px;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
      "Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  h1{ font-size:1.35rem; margin:0 0 6px; letter-spacing:-.02em; }
  .sub{ color:var(--muted); font-size:.9rem; margin:0 0 4px; }
  .legend{
    margin:16px 0 24px; padding:12px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    font-size:.88rem; color:var(--muted);
  }
  .legend b{ color:var(--ink); }
  figure{
    margin:0 0 32px; padding:12px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  figcaption{ margin:0 0 10px; }
  figcaption .t{ display:block; font-size:1.05rem; font-weight:700; }
  figcaption .d{ display:block; font-size:.85rem; color:var(--muted); }
  img{
    display:block; width:100%; max-width:100%; height:auto;
    border-radius:8px; background:#0000000d;
  }
  .hint{ margin-top:8px; font-size:.8rem; color:var(--muted); }
  a{ color:var(--accent); }
  footer{ margin-top:32px; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <h1>14차 증거 — #5 컷툰 캐스트 수리 비교컷</h1>
  <p class="sub">각 시트는 <b>수리 전 / 수리 후</b>를 나란히 붙여 놓은 것입니다. 원본 3732×1502.</p>

  <div class="legend">
    보는 법 — 한 시트 안에 컷이 <b>좌우로 짝</b>지어 있습니다.
    왼쪽이 <b>수리 전</b>, 오른쪽이 <b>수리 후</b>입니다.
    이미지를 눌러 확대하면 원본 해상도로 볼 수 있습니다.
  </div>

  <figure>
    <figcaption>

      <span class="d">컷 o6 · o7 · p1 — 각각 수리 전/후</span>
    </figcaption>
    <a href="05-COMPARE-princess.png">

  <figure>
    <figcaption>

    </figcaption>
    <a href="05-COMPARE-tenten.png">
      <img src="05-COMPARE-tenten.png" alt="텐텐 왕자 수리 전후 비교 시트" loading="lazy">
    </a>

  <figure>

      <span class="t">3. 트윈 왕자</span>

    <a href="05-COMPARE-twin.png">
