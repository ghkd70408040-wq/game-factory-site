<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틴트윈 관제탑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%97%BC</text></svg>">
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#3D2B26; --sub:#8A7468; --line:#EADFD6;
  --ok:#2E9E5B; --css:#2B7DC7; --temp:#C98A1B; --queued:#7B6AC7; --empty:#C24545;
  --dark:#2B2320;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:64rem;margin:0 auto;padding:12px}

/* ── 1. 제목 ── */
h1{font-size:1.35rem;margin:8px 0 10px}

/* ── 2. 분류 필터 (sticky 한 줄) ── */
.filters{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 9px;margin-bottom:16px;
  border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.fb{font-family:inherit;font-size:.78rem;padding:5px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:#FFF;color:var(--ink)}
.fb:hover{border-color:var(--sub)}
.fb.on{background:var(--ink);color:#FFF;border-color:var(--ink)}

/* ── 3-A. 섹션 (큰 번호 제목) ── */
section.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin-bottom:22px;overflow:hidden}
section.cat>h2{font-size:1.14rem;margin:0;padding:15px 16px;background:#F1E3D3;
  border-bottom:2px solid #E0CDB6;display:flex;align-items:center;gap:10px;letter-spacing:.01em}
section.cat>h2 .rn{display:inline-flex;align-items:center;justify-content:center;
  min-width:2.1em;height:2.1em;border-radius:50%;background:var(--ink);color:#FFF;
  font-size:.86rem;font-weight:800;flex:0 0 auto}

.secbody{display:flex;align-items:flex-start}

/* ── 3-B. 배경 사이드 (분리) ── */
.side{flex:0 0 180px;width:180px;align-self:flex-start;position:sticky;top:56px;
  padding:12px 10px;background:#F6EDE2;border-right:1px solid var(--line)}
.sidehead{font-size:.72rem;font-weight:800;color:var(--sub);letter-spacing:.08em;margin-bottom:8px}
.bgcard{background:var(--dark);border:2px solid #1C1614;border-radius:10px;overflow:hidden;margin-bottom:10px}
.bgcard.st-empty{border:2px dashed var(--empty)}
.bgcard .band{background:#3E5E43;color:#FFF;font-size:.6rem;font-weight:700;text-align:center;padding:2px 0}
.bgcard img{width:100%;height:76px;object-fit:cover;display:block}
.bgcard .bgph{height:76px;display:flex;align-items:center;justify-content:center;
  color:#B9A99C;font-size:.66rem;background:#231D1A}
.bgcard .bmeta{padding:5px 6px 6px;color:#F3E9DF;font-size:.66rem;line-height:1.35}
.bgcard .bmeta .slab2{color:#C9B9AC;font-size:.6rem}

/* ── 3-C. 그룹 (굵은 헤더) ── */
.mainbody{flex:1 1 auto;min-width:0}
details.grp{border-top:1px solid var(--line);border-left:4px solid #E9D7BE}
details.grp:first-child{border-top:0}
details.grp>summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:.95rem;
  list-style:none;display:flex;align-items:center;gap:8px;background:#FCF7F1}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--sub);font-weight:400;transition:.15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
summary .cnt{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--sub);
  font-variant-numeric:tabular-nums}

/* ── 3-D. 부품 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:10px 12px 15px}
.acard{position:relative;border:1px solid var(--line);border-radius:11px;background:#FDFAF6;
  overflow:hidden;display:flex;flex-direction:column}
.acard.st-empty{border:2px dashed var(--empty);background:#FCF3F3}
.thumb{height:74px;display:flex;align-items:center;justify-content:center;position:relative;
  background:conic-gradient(#EFE7DC 25%,#F8F2EA 0 50%,#EFE7DC 0 75%,#F8F2EA 0) 0 0/16px 16px}
.thumb img{max-width:92%;max-height:66px;object-fit:contain}
.thumb .ph{font-size:.66rem;color:var(--sub);text-align:center;padding:4px}
.st-empty .thumb .ph{color:var(--empty);font-weight:700}
.tbadge{position:absolute;left:4px;top:4px;font-size:.58rem;padding:1px 6px;border-radius:6px;
  color:#FFF;background:#8A7468;z-index:2}
.tbadge.bg{background:#3E5E43}.tbadge.code{background:#5B7B9E}
.tbadge.motion{background:#9E5B8E}.tbadge.plan{background:#7D7D7D}
.dbadge{position:absolute;right:4px;top:4px;font-size:.56rem;padding:1px 5px;border-radius:6px;
  color:#4A3208;background:#FBD86A;font-weight:700;z-index:2}
.meta{padding:6px 7px 7px;font-size:.7rem;line-height:1.3}
.meta .nm{display:block;font-weight:700}
.meta .nt{display:block;color:var(--temp);font-size:.62rem;margin-top:2px}
.sdot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:4px}
.s-ok{background:var(--ok)}.s-css{background:var(--css)}.s-temp{background:var(--temp)}
.s-queued{background:var(--queued)}.s-empty{background:var(--empty)}
.slab{font-size:.62rem;color:var(--sub)}

/* ── 4. 그룹 안 조립 화면 미리보기 (한 번에 하나만 산다) ── */
.gbody{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 15px}
.gbody>.grid{flex:1 1 auto;min-width:0;padding:0}
.pv{flex:0 0 214px;width:214px}
.pvbtn{width:100%;font-family:inherit;font-size:.74rem;padding:11px 6px;border-radius:11px;
  border:1px dashed var(--sub);background:#FCF7F1;color:var(--sub);cursor:pointer}
.pvbtn:hover{border-color:var(--ink);color:var(--ink)}
.bgcard.pick{cursor:pointer}
.bgcard.sel{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.phonewrap{position:relative;overflow:hidden}
.phone{width:390px;height:844px;transform-origin:top left;border:8px solid var(--ink);
  border-radius:30px;overflow:hidden;background:#000}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#FFF}

/* ── 5. 밤샘 작업 일지 ── */
#worklog{margin-bottom:22px}
.logday{background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin-bottom:18px;overflow:hidden}
.logday>h2{font-size:1.06rem;margin:0;padding:13px 16px;background:#F1E3D3;
  border-bottom:2px solid #E0CDB6;display:flex;align-items:center;gap:9px}
.logday>h2 .moon{font-size:1.1rem}
.logday>h2 .cnt{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--sub);
  font-variant-numeric:tabular-nums}
.logitem{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
  border-left:4px solid #E9D7BE;background:#FCF7F1}
.logitem:first-of-type{border-top:0}
.logitem .when{flex:0 0 62px;font-size:.74rem;font-weight:800;color:var(--sub);
  font-variant-numeric:tabular-nums;padding-top:1px}
.logitem .core{flex:1 1 auto;min-width:0}
.logitem .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.wv{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;color:#FFF;
  background:var(--queued)}
.logitem .ttl{font-weight:800;font-size:.93rem}
.stt{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#FFF}
.stt.done{background:var(--ok)}.stt.doing{background:var(--css)}.stt.hold{background:var(--temp)}
.logitem ul{margin:0;padding-left:17px;font-size:.78rem;line-height:1.55;color:#4E3A33}
.logitem .sha{display:inline-block;margin-top:5px;font-size:.66rem;color:var(--sub);
  font-family:ui-monospace,Consolas,monospace;background:#F1E7DC;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}
.logempty{padding:16px;color:var(--sub);font-size:.8rem}
@media (max-width:720px){
  .logitem{display:block}
  .logitem .when{margin-bottom:3px}
}

/* ── 좁은 화면: 사이드 → 가로 스크롤 줄 ── */
@media (max-width:720px){
  .secbody{display:block}
  .side{position:static;width:auto;flex:none;display:flex;gap:8px;align-items:flex-start;
    overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .sidehead{flex:0 0 auto;margin:0;align-self:center;writing-mode:horizontal-tb}
  .bgcard{flex:0 0 132px;width:132px;margin-bottom:0}
  .bgcard img,.bgcard .bgph{height:64px}
  .gbody{display:block}
  .pv{flex:none;width:auto;max-width:390px;margin-top:10px}
}

/* ── 6. 🧪 에셋 검수 (확대 검수 → 승인) ── */
#assetview{margin-bottom:22px}
.avbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.avsearch{font-family:inherit;font-size:.8rem;padding:6px 13px;border-radius:99px;
  border:1px solid var(--line);background:#FFF;color:var(--ink);flex:1 1 190px;max-width:300px}
.avsearch:focus{outline:0;border-color:var(--sub)}
.avcnt{margin-left:auto;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
details.avgrp{background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin-bottom:14px;overflow:hidden}
details.avgrp>summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:1rem;
  list-style:none;display:flex;align-items:center;gap:9px;background:#F1E3D3;
  border-bottom:2px solid #E0CDB6}
details.avgrp>summary::-webkit-details-marker{display:none}
details.avgrp>summary::before{content:'▸';color:var(--sub);font-weight:400;transition:.15s}
details.avgrp[open]>summary::before{transform:rotate(90deg)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;
  padding:11px 13px 15px}
.avcard{position:relative;border:1px solid var(--line);border-radius:11px;background:#FDFAF6;
  overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;text-align:left;
  font-family:inherit;color:inherit;padding:0}
.avcard:hover{border-color:var(--sub);box-shadow:0 2px 8px rgba(61,43,38,.13)}
.avthumb{height:88px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#EFE7DC 25%,#F8F2EA 0 50%,#EFE7DC 0 75%,#F8F2EA 0) 0 0/16px 16px}
.avthumb img{max-width:92%;max-height:80px;object-fit:contain}
.avmeta{padding:6px 7px 7px;font-size:.7rem;line-height:1.3}
.avmeta .nm{display:block;font-weight:700;word-break:break-all}
.avmeta .sz{display:block;color:var(--sub);font-size:.62rem;font-variant-numeric:tabular-nums}
.avb{position:absolute;left:4px;top:4px;font-size:.58rem;padding:1px 7px;border-radius:6px;
  color:#FFF;font-weight:700;z-index:2}
.avb.wait{background:var(--temp)}.avb.ok{background:var(--ok)}.avb.no{background:var(--empty)}
.avold{position:absolute;right:4px;top:4px;font-size:.56rem;padding:1px 5px;border-radius:6px;
  background:#FBD86A;color:#4A3208;font-weight:700;z-index:2}
.avnone{padding:18px;color:var(--sub);font-size:.8rem;background:var(--card);
  border:1px solid var(--line);border-radius:16px}

/* 라이트박스 — 원본 그대로 확대·비교 */
#lbox{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  background:rgba(28,22,20,.9)}
#lbox[hidden]{display:none}
.lbtool{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.lbtitle{font-weight:800;font-size:.92rem;word-break:break-all}
.lbinfo{font-size:.7rem;color:var(--sub);font-variant-numeric:tabular-nums}
.lbsep{flex:1 1 8px}
.lbsel{font-family:inherit;font-size:.75rem;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);background:#FFF;color:var(--ink);max-width:200px}
.lbstage{flex:1 1 auto;display:flex;gap:8px;padding:8px;overflow:hidden}
.lbpane{flex:1 1 0;min-width:0;position:relative;overflow:hidden;border-radius:12px;
  touch-action:none;cursor:grab}
.lbpane.drag{cursor:grabbing}
.lbpane img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;
  user-select:none;-webkit-user-drag:none}
.lbpane.px img{image-rendering:pixelated}
.lbpane .plab{position:absolute;left:8px;top:8px;z-index:2;background:rgba(43,35,32,.8);
  color:#FFF;font-size:.66rem;padding:3px 9px;border-radius:99px;pointer-events:none}
.bg-check{background:conic-gradient(#DCD3C7 25%,#F2ECE3 0 50%,#DCD3C7 0 75%,#F2ECE3 0) 0 0/22px 22px}
.bg-light{background:#FBF6EF}
.bg-dark{background:#2B2320}
.bg-game{background:#84966B}

@media (max-width:720px){
  .avgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;padding:9px 10px 13px}
  .avthumb{height:74px}.avthumb img{max-height:68px}
  .avsearch{max-width:none}
  .lbtool{padding:7px 9px;gap:4px}
  .lbtool .fb{font-size:.72rem;padding:4px 10px}
  .lbtitle{font-size:.82rem;width:100%}
  .lbstage{flex-direction:column;padding:6px;gap:6px}
}
</style>
</head>
<body>
<main>
<h1>🗼 틴트윈 관제탑</h1>
<div class="filters" id="filters"></div>
<div id="worklog" hidden></div>
<div id="assetview" hidden></div>
<div id="cats"></div>
</main>

<div id="lbox" hidden>
  <div class="lbtool">
    <span class="lbtitle" id="lbTitle"></span>
    <span class="lbinfo" id="lbInfo"></span>
    <span class="lbsep"></span>
    <button class="fb" type="button" id="lbOut">－</button>
    <button class="fb" type="button" id="lbZoom">100%</button>
    <button class="fb" type="button" id="lbIn">＋</button>
    <button class="fb" type="button" id="lbFit">맞춤</button>
    <button class="fb" type="button" id="lbPx">픽셀 확대</button>
    <button class="fb on" type="button" data-bg="check">체커</button>
    <button class="fb" type="button" data-bg="light">밝음</button>
    <button class="fb" type="button" data-bg="dark">어두움</button>
    <button class="fb" type="button" data-bg="game">게임배경</button>
    <select class="lbsel" id="lbOld" hidden></select>
    <button class="fb" type="button" id="lbGame" hidden>▶ 게임 화면에서 보기</button>
    <button class="fb" type="button" id="lbClose">✕ 닫기</button>
  </div>
  <div class="lbstage" id="lbStage"></div>
</div>

<script>
const SD={ok:'s-ok',css:'s-css',temp:'s-temp',queued:'s-queued',empty:'s-empty'};
const SL={ok:'확보',css:'CSS',temp:'임시',queued:'발주·예약',empty:'빈칸'};
const TB={bg:'배경',code:'코드',motion:'모션',plan:'기획'};
const TABS=[['all','전체'],['bg','배경'],['char','캐릭터'],['fruit','과일'],
            ['fx','효과'],['ui','인터페이스'],['time','시간'],['dyn','⚡동적'],
            ['asset','🧪 에셋 검수'],['log','🌙 밤샘 일지']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M={};

function thumbHTML(ref,st){
  if(ref&&ref.indexOf('img:')===0){
    const key=ref.slice(4),f=M[key];
    if(f) return '<div class="thumb"><img loading="lazy" src="catalog/'+f.file+'" alt=""></div>';
    return '<div class="thumb"><span class="ph">실물 미연결<br>('+esc(key)+')</span></div>';
  }
  if(st==='empty')  return '<div class="thumb"><span class="ph">없음</span></div>';
  if(st==='queued') return '<div class="thumb"><span class="ph">발주·예약</span></div>';
  return '<div class="thumb"><span class="ph">코드·CSS</span></div>';
}

function mkCard(it){
  const nm=it[0],ty=it[1],st=it[2],ref=it[3],note=it[4],cls=it[5],dyn=it[6];
  const el=document.createElement('div');
  el.className='acard st-'+st;
  el.dataset.cls=cls; el.dataset.dyn=dyn;
  el.innerHTML=thumbHTML(ref,st)
    +(ty!=='asset'?'<span class="tbadge '+ty+'">'+TB[ty]+'</span>':'')
    +(dyn?'<span class="dbadge">⚡동적</span>':'')
    +'<div class="meta"><span class="nm">'+esc(nm)+'</span>'
    +'<span><span class="sdot '+SD[st]+'"></span><span class="slab">'+SL[st]+'</span></span>'
    +(note?'<span class="nt">'+esc(note)+'</span>':'')+'</div>';
  if(ref&&ref.indexOf('img:')===0&&M[ref.slice(4)]){ el.style.cursor='zoom-in';
    el.addEventListener('click',function(){ openLB(ref.slice(4)); }); }   /* 부품 카드 → 라이트박스 */
  return el;
}

function mkBgCard(it,si){
  const nm=it[0],st=it[2],ref=it[3],dyn=it[6];
  const el=document.createElement('div');
  el.className='bgcard st-'+st;
  el.dataset.cls='bg'; el.dataset.dyn=dyn; el.dataset.si=String(si);
  const f=(ref&&ref.indexOf('img:')===0)?M[ref.slice(4)]:null;
  if(f){ el.classList.add('pick'); el.dataset.bg=ref.slice(4);
         el.addEventListener('click',function(){ pickBg(el); }); }
  el.innerHTML='<div class="band">배경</div>'
    +(f?'<img loading="lazy" src="catalog/'+f.file+'" alt="">'
       :'<div class="bgph">'+(st==='empty'?'없음':st==='queued'?'발주·예약':'코드·CSS')+'</div>')
    +'<div class="bmeta">'+esc(nm)+'<br><span class="sdot '+SD[st]+'"></span>'
    +'<span class="slab2">'+SL[st]+'</span></div>';
  return el;
}

/* ── 조립 화면 미리보기 ───────────────────────────────────────────────
   ACT 는 지금 살아 있는 미리보기 하나(폰 성능 보호 — 동시 1개만).
   SECBG[si] 는 그 섹션에서 고른 배경 키(없으면 게임 기본 배경). */
let ACT=null; const SECBG={};

function srcFor(scr,bg){
  const q=[];
  if(scr&&scr!=='splash') q.push('screen='+encodeURIComponent(scr));
  if(bg) q.push('bg='+encodeURIComponent(bg));
  return 'tentwin.html'+(q.length?'?'+q.join('&'):'');
}

function mkPreview(scr,si){
  const pv=document.createElement('div'); pv.className='pv';
  pv.dataset.scr=scr; pv.dataset.si=String(si);
  resetPv(pv);
  return pv;
}

function resetPv(pv){
  pv.innerHTML='<button class="pvbtn" type="button">▶ 조립 화면 보기</button>';
  pv.querySelector('.pvbtn').addEventListener('click',function(){ openPv(pv); });
  if(ACT&&ACT.pv===pv) ACT=null;
}

function openPv(pv){
  if(ACT&&ACT.pv!==pv) resetPv(ACT.pv);          /* 다른 미리보기는 내린다 */
  const scr=pv.dataset.scr, si=pv.dataset.si;
  pv.innerHTML='<div class="phonewrap"><div class="phone"><iframe title="조립 화면" src="'
    +esc(srcFor(scr,SECBG[si]))+'"></iframe></div></div>';
  ACT={pv:pv,scr:scr,si:si};
  fitPv();
}

function fitPv(){
  if(!ACT) return;
  const wrap=ACT.pv.querySelector('.phonewrap'), ph=ACT.pv.querySelector('.phone');
  if(!wrap||!ph) return;
  const s=Math.min(1,wrap.clientWidth/390);
  ph.style.transform='scale('+s+')';
  wrap.style.height=(844*s)+'px';
}
window.addEventListener('resize',fitPv);

/* 사이드 배경 카드 = 배경 선택 버튼. 같은 카드를 다시 누르면 기본 배경으로. */
function pickBg(card){
  const si=card.dataset.si, k=card.dataset.bg;
  const next=(SECBG[si]===k)?null:k;
  SECBG[si]=next;
  card.parentNode.querySelectorAll('.bgcard').forEach(x=>x.classList.remove('sel'));
  if(next) card.classList.add('sel');
  if(ACT&&ACT.si===si){
    const fr=ACT.pv.querySelector('iframe');
    if(fr) fr.src=srcFor(ACT.scr,next);
  }else{
    const first=document.querySelector('.pv[data-si="'+si+'"]');
    if(first) openPv(first);                     /* 없으면 이 섹션 첫 화면을 연다 */
  }
}

/* ── 밤샘 작업 일지 ─────────────────────────────────────────────────
   board-data.json 의 worklog 배열만 읽는다. 항목 1개를 append 하면 바로 뜬다.
   { t:"2026-08-20 02:10", wave:"W0", title:"...", summary:["..."],
     status:"완료|진행|보류", commit:"0704500" }                            */
const STC={'완료':'done','진행':'doing','보류':'hold'};

function dayLabel(t){
  const d=String(t).slice(0,10), h=parseInt(String(t).slice(11,13),10);
  const band=(isNaN(h)||h>=18||h<6)?'밤':'낮';
  return d+' '+band;
}

function mkLogItem(e){
  const el=document.createElement('article'); el.className='logitem';
  const sum=Array.isArray(e.summary)?e.summary:(e.summary?[e.summary]:[]);
  el.innerHTML='<div class="when">'+esc(String(e.t||'').slice(11)||'—')+'</div>'
    +'<div class="core"><div class="hd">'
    +(e.wave?'<span class="wv">'+esc(e.wave)+'</span>':'')
    +'<span class="ttl">'+esc(e.title||'')+'</span>'
    +'<span class="stt '+(STC[e.status]||'doing')+'">'+esc(e.status||'진행')+'</span>'
    +'</div>'
    +(sum.length?'<ul>'+sum.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')
    +(e.commit?'<span class="sha">'+esc(e.commit)+'</span>':'')
    +'</div>';
  return el;
}

function renderWorklog(list){
  const box=document.getElementById('worklog');
  box.innerHTML='';
  const L=(list||[]).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  if(!L.length){ box.innerHTML='<div class="logday"><div class="logempty">아직 기록이 없습니다.</div></div>'; return; }
  let cur=null, day=null;
  L.forEach(function(e){
    const lb=dayLabel(e.t);
    if(lb!==day){
      day=lb;
      cur=document.createElement('section'); cur.className='logday';
      cur.innerHTML='<h2><span class="moon">🌙</span>'+esc(lb)+'<span class="cnt"></span></h2>';
      box.appendChild(cur);
    }
    cur.appendChild(mkLogItem(e));
    cur.querySelector('.cnt').textContent=cur.querySelectorAll('.logitem').length+'건';
  });
}

/* 패널 3개(부품표 cats / 밤샘 일지 worklog / 에셋 검수 assetview) 중 하나만 보인다. */
function showPane(name){
  document.getElementById('worklog').hidden   = name!=='log';
  document.getElementById('assetview').hidden = name!=='asset';
  document.getElementById('cats').style.display = name==='cats' ? '' : 'none';
}

/* ── 🧪 에셋 검수 ─────────────────────────────────────────────────────
   manifest 전 항목을 접두사로 묶어 깔고, 카드를 누르면 원본 그대로 확대한다.
   승인 상태는 staging.json 이 정본 — 없거나 키가 빠졌으면 "적용"으로 본다.      */
const AVG=[['art','배경·일러스트'],['ch','캐릭터'],['cut','컷신'],['duel','대전'],
           ['jelly','젤리'],['lib','공용 부품'],['sian','시안 1차'],['sian2','시안 2차'],
           ['sian3','시안 3차'],['stage','스테이지 맵'],['tmr','타임러시 숫자']];
const AVL={}; AVG.forEach(g=>AVL[g[0]]=g[1]);
const STCLS={'대기':'wait','적용':'ok','반려':'no'};
let AVS={}, AVBUILT=false, OLDV={};

function stOf(k){ const s=AVS[k]; return (s&&s.state)||'적용'; }
function noteOf(k){ const s=AVS[k]; return (s&&s.note)||''; }
function keysOf(){ return Object.keys(M).filter(k=>k.charAt(0)!=='_'); }

function buildOldIndex(){
  OLDV={};
  const sup=M._superseded||{};
  Object.keys(sup).forEach(function(f){
    const v=sup[f]; if(!v.stem) return;
    (OLDV[v.stem]=OLDV[v.stem]||[]).push({file:f,kb:v.kb,px:v.px,mtime:v.mtime,ver:v.ver||'구판'});
  });
  Object.keys(OLDV).forEach(k=>OLDV[k].sort((a,b)=>a.file.localeCompare(b.file)));
}

function mkAvCard(k){
  const f=M[k], st=stOf(k), old=OLDV[k];
  const el=document.createElement('button');
  el.type='button'; el.className='avcard'; el.dataset.k=k; el.dataset.st=st;
  el.innerHTML='<span class="avb '+STCLS[st]+'">'+esc(st)+'</span>'
    +(old?'<span class="avold">전판 '+old.length+'</span>':'')
    +'<span class="avthumb"><img loading="lazy" src="catalog/'+esc(f.file)+'" alt=""></span>'
    +'<span class="avmeta"><span class="nm">'+esc(k)+'</span>'
    +'<span class="sz">'+f.kb+'KB · '+esc(f.px||'—')+'</span></span>';
  el.addEventListener('click',function(){ openLB(k); });
  return el;
}

function buildAssetView(){
  if(AVBUILT) return;
  AVBUILT=true;
  buildOldIndex();
  const box=document.getElementById('assetview');
  box.innerHTML='';

  const bar=document.createElement('div'); bar.className='avbar';
  bar.innerHTML='<input class="avsearch" id="avq" type="search" placeholder="이름으로 찾기 (예: ch-pudding)">'
    +['전체','대기','적용','반려'].map((s,i)=>'<button class="fb'+(i?'':' on')
      +'" type="button" data-st="'+esc(s)+'">'+esc(s)+'</button>').join('')
    +'<span class="avcnt" id="avcnt"></span>';
  box.appendChild(bar);

  const groups={};
  keysOf().forEach(function(k){
    const g=k.indexOf('-')>0?k.slice(0,k.indexOf('-')):k;
    (groups[AVL[g]?g:'etc']=groups[AVL[g]?g:'etc']||[]).push(k);
  });
  const order=AVG.map(g=>g[0]).filter(g=>groups[g]).concat(groups.etc?['etc']:[]);
  order.forEach(function(g){
    const det=document.createElement('details'); det.className='avgrp'; det.open=true;
    det.dataset.g=g;
    det.innerHTML='<summary>'+esc(AVL[g]||'기타')
      +'<span class="cnt">'+groups[g].length+'</span></summary>';
    const grid=document.createElement('div'); grid.className='avgrid';
    groups[g].forEach(k=>grid.appendChild(mkAvCard(k)));
    det.appendChild(grid); box.appendChild(det);
  });

  const none=document.createElement('div'); none.className='avnone'; none.id='avnone';
  none.hidden=true; none.textContent='조건에 맞는 에셋이 없습니다.';
  box.appendChild(none);

  bar.querySelector('#avq').addEventListener('input',avFilter);
  bar.querySelectorAll('.fb').forEach(function(b){
    b.addEventListener('click',function(){
      bar.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); avFilter();
    });
  });
  avFilter();
}

function avFilter(){
  const box=document.getElementById('assetview');
  const q=(box.querySelector('#avq').value||'').trim().toLowerCase();
  const on=box.querySelector('.avbar .fb.on');
  const st=on?on.dataset.st:'전체';
  let live=0;
  box.querySelectorAll('details.avgrp').forEach(function(det){
    let n=0;
    det.querySelectorAll('.avcard').forEach(function(c){
      const hit=(!q||c.dataset.k.toLowerCase().indexOf(q)>=0)
             && (st==='전체'||c.dataset.st===st);
      c.style.display=hit?'':'none'; if(hit) n++;
    });
    det.style.display=n?'':'none';
    det.querySelector('.cnt').textContent=n;
    live+=n;
  });
  box.querySelector('#avcnt').textContent=live+' / '+keysOf().length+'개';
  box.querySelector('#avnone').hidden=!!live;
}

/* ── 라이트박스: 원본 URL 그대로, 변환 없이 확대·비교 ─────────────────── */
const LB={key:null,z:1,pan:{x:0,y:0},px:false,panes:[]};
const LBOX=()=>document.getElementById('lbox');

function lbRender(){
  LB.panes.forEach(function(p){
    const bw=p.el.clientWidth, bh=p.el.clientHeight;
    const tx=(bw-p.nw*LB.z)/2+LB.pan.x, ty=(bh-p.nh*LB.z)/2+LB.pan.y;
    p.img.style.transform='translate('+tx+'px,'+ty+'px) scale('+LB.z+')';
    p.img.style.width=p.nw+'px'; p.img.style.height=p.nh+'px';
  });
  document.getElementById('lbZoom').textContent=Math.round(LB.z*100)+'%';
}

function lbFit(){
  LB.pan.x=0; LB.pan.y=0;
  const p=LB.panes[0]; if(!p||!p.nw){ LB.z=1; lbRender(); return; }
  const bw=p.el.clientWidth-24, bh=p.el.clientHeight-24;
  LB.z=Math.max(.25,Math.min(8,Math.min(bw/p.nw,bh/p.nh,1)));
  lbRender();
}

function lbZoomAt(pane,cx,cy,f){
  const z2=Math.max(.25,Math.min(8,LB.z*f));
  if(pane&&pane.nw){
    const bw=pane.el.clientWidth, bh=pane.el.clientHeight;
    const tx=(bw-pane.nw*LB.z)/2+LB.pan.x, ty=(bh-pane.nh*LB.z)/2+LB.pan.y;
    const ux=(cx-tx)/LB.z, uy=(cy-ty)/LB.z;
    LB.pan.x=cx-ux*z2-(bw-pane.nw*z2)/2;
    LB.pan.y=cy-uy*z2-(bh-pane.nh*z2)/2;
  }
  LB.z=z2; lbRender();
}

function mkPane(src,label){
  const el=document.createElement('div');
  el.className='lbpane bg-'+(LB.bg||'check')+(LB.px?' px':'');
  el.innerHTML='<span class="plab">'+esc(label)+'</span>';
  const img=document.createElement('img'); img.alt=label; img.src=src;
  el.appendChild(img);
  const p={el:el,img:img,nw:0,nh:0};
  function done(){ p.nw=img.naturalWidth||1; p.nh=img.naturalHeight||1;
                   if(LB.panes[0]===p) lbFit(); else lbRender(); }
  if(img.complete&&img.naturalWidth) done(); else img.addEventListener('load',done);

  let drag=null;
  el.addEventListener('pointerdown',function(e){
    drag={x:e.clientX,y:e.clientY}; el.classList.add('drag');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',function(e){
    if(!drag) return;
    LB.pan.x+=e.clientX-drag.x; LB.pan.y+=e.clientY-drag.y;
    drag={x:e.clientX,y:e.clientY}; lbRender();
  });
  ['pointerup','pointercancel'].forEach(t=>el.addEventListener(t,function(){
    drag=null; el.classList.remove('drag'); }));
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    const r=el.getBoundingClientRect();
    lbZoomAt(p,e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);
  },{passive:false});
  return p;
}

function lbStage(oldFile){
  const stage=document.getElementById('lbStage');
  stage.innerHTML=''; LB.panes=[];
  const f=M[LB.key];
  const cur=mkPane('catalog/'+f.file,'현행 '+LB.key);
  LB.panes.push(cur); stage.appendChild(cur.el);
  if(oldFile){
    const meta=(OLDV[LB.key]||[]).filter(o=>o.file===oldFile)[0]||{};
    const old=mkPane('catalog/_superseded/'+oldFile,
      '전판 '+(meta.ver||'')+' · '+(meta.kb||'?')+'KB · '+(meta.px||'?'));
    LB.panes.push(old); stage.appendChild(old.el);
  }
  lbFit();
}

function lbBg(name){
  LB.bg=name;
  document.querySelectorAll('#lbox .lbtool .fb[data-bg]').forEach(function(b){
    b.classList.toggle('on',b.dataset.bg===name); });
  document.querySelectorAll('#lbox .lbpane').forEach(function(el){
    el.className='lbpane bg-'+name+(LB.px?' px':''); });
}

function openLB(key){
  if(!M[key]) return;
  if(ACT) resetPv(ACT.pv);                 /* 미리보기 iframe 은 동시 1개 규칙 */
  LB.key=key;
  const f=M[key], st=stOf(key), note=noteOf(key);
  document.getElementById('lbTitle').textContent=key;
  document.getElementById('lbInfo').textContent=
    f.file+' · '+f.kb+'KB · '+(f.px||'—')+' · '+st+(note?' · '+note:'');
  const sel=document.getElementById('lbOld'), old=OLDV[key]||[];
  sel.hidden=!old.length;
  sel.innerHTML='<option value="">전판 보기 ('+old.length+')</option>'
    +old.map(o=>'<option value="'+esc(o.file)+'">'+esc(o.ver)+' · '+o.kb+'KB · '
      +esc(o.mtime||'')+'</option>').join('');
  const gb=document.getElementById('lbGame');
  gb.hidden=key.indexOf('art-')!==0;       /* 배경류만 게임 실렌더로 점프 */
  LBOX().hidden=false;
  lbBg(LB.bg||'check');
  lbStage('');
}

function closeLB(){ LBOX().hidden=true; document.getElementById('lbStage').innerHTML='';
                    LB.panes=[]; }

function lbInit(){
  buildOldIndex();
  document.getElementById('lbClose').addEventListener('click',closeLB);
  document.getElementById('lbFit').addEventListener('click',lbFit);
  document.getElementById('lbZoom').addEventListener('click',function(){
    LB.z=1; LB.pan.x=0; LB.pan.y=0; lbRender(); });
  document.getElementById('lbIn').addEventListener('click',function(){
    const p=LB.panes[0]; if(p) lbZoomAt(p,p.el.clientWidth/2,p.el.clientHeight/2,1.25); });
  document.getElementById('lbOut').addEventListener('click',function(){
    const p=LB.panes[0]; if(p) lbZoomAt(p,p.el.clientWidth/2,p.el.clientHeight/2,.8); });
  document.getElementById('lbPx').addEventListener('click',function(){
    LB.px=!LB.px; this.classList.toggle('on',LB.px); lbBg(LB.bg||'check'); });
  document.querySelectorAll('#lbox .lbtool .fb[data-bg]').forEach(function(b){
    b.addEventListener('click',function(){ lbBg(b.dataset.bg); }); });
  document.getElementById('lbOld').addEventListener('change',function(){
    lbStage(this.value); });
  document.getElementById('lbGame').addEventListener('click',function(){
    const k=LB.key; closeLB();
    const fbox=document.getElementById('filters');
    fbox.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
    fbox.querySelector('.fb').classList.add('on');
    showPane('cats'); applyFilter('all');
    const pv=document.querySelector('.pv'); if(!pv) return;
    SECBG[pv.dataset.si]=k; openPv(pv);
    pv.scrollIntoView({block:'center',behavior:'smooth'});
  });
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!LBOX().hidden) closeLB(); });
  window.addEventListener('resize',function(){ if(!LBOX().hidden) lbRender(); });
}

function applyFilter(f){
  document.querySelectorAll('.acard,.bgcard').forEach(function(c){
    const on = f==='all' ? true
             : f==='dyn' ? c.dataset.dyn==='1'
             : c.dataset.cls===f;
    c.style.display = on ? '' : 'none';
  });
  document.querySelectorAll('section.cat').forEach(function(sec){
    let live=0;
    sec.querySelectorAll('details.grp').forEach(function(d){
      let n=0;
      d.querySelectorAll('.acard').forEach(c=>{ if(c.style.display!=='none') n++; });
      d.style.display = n ? '' : 'none';
      live+=n;
    });
    const side=sec.querySelector('.side');
    if(side){
      let n=0;
      side.querySelectorAll('.bgcard').forEach(c=>{ if(c.style.display!=='none') n++; });
      side.style.display = n ? '' : 'none';
      live+=n;
    }
    sec.style.display = live ? '' : 'none';
  });
}

Promise.all([
  fetch('board-data.json?v='+Date.now()).then(r=>r.json()),
  fetch('catalog/manifest.json?v='+Date.now()).then(r=>r.json()),
  /* 승인 상태표 — 없으면 전부 "적용"으로 본다 */
  fetch('staging.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(function(res){
  const D=res[0]; M=res[1]; AVS=res[2]||{};
  lbInit();

  const fbox=document.getElementById('filters');
  TABS.forEach(function(t,i){
    const b=document.createElement('button');
    b.className='fb'+(i===0?' on':''); b.textContent=t[1]; b.dataset.f=t[0];
    b.addEventListener('click',function(){
      fbox.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(t[0]==='log'){ showPane('log'); return; }
      if(t[0]==='asset'){ showPane('asset'); buildAssetView(); return; }
      showPane('cats'); applyFilter(t[0]);
    });
    fbox.appendChild(b);
  });

  renderWorklog(D.worklog);

  const cats=document.getElementById('cats');
  D.sections.forEach(function(sec,si){
    const s=document.createElement('section'); s.className='cat';
    const m=sec.title.match(/^([Ⅰ-Ⅶ]+)\.\s*(.*)$/);
    const h=document.createElement('h2');
    h.innerHTML = m ? '<span class="rn">'+esc(m[1])+'</span>'+esc(m[2]) : esc(sec.title);
    s.appendChild(h);

    const body=document.createElement('div'); body.className='secbody';
    const bgItems=[];
    sec.groups.forEach(g=>g.items.forEach(it=>{ if(it[5]==='bg') bgItems.push(it); }));

    if(bgItems.length){
      const side=document.createElement('aside'); side.className='side';
      side.innerHTML='<div class="sidehead">배경</div>';
      bgItems.forEach(it=>side.appendChild(mkBgCard(it,si)));
      body.appendChild(side);
    }

    const mb=document.createElement('div'); mb.className='mainbody';
    sec.groups.forEach(function(g){
      const items=g.items.filter(it=>it[5]!=='bg');   /* 배경은 사이드 전용 */
      if(!items.length) return;
      const det=document.createElement('details'); det.className='grp'; det.open=true;
      const filled=items.filter(it=>it[2]==='ok'||it[2]==='css').length;
      det.innerHTML='<summary>'+esc(g.name)
        +'<span class="cnt">'+filled+'/'+items.length+'</span></summary>';
      const gb=document.createElement('div'); gb.className='gbody';
      const grid=document.createElement('div'); grid.className='grid';
      items.forEach(it=>grid.appendChild(mkCard(it)));
      gb.appendChild(grid);
      if(g.scr) gb.appendChild(mkPreview(g.scr,si));   /* 화면에 대응하는 그룹만 */
      det.appendChild(gb);
      det.addEventListener('toggle',function(){
        if(!det.open&&ACT&&det.contains(ACT.pv)) resetPv(ACT.pv);
      });
      mb.appendChild(det);
    });

    body.appendChild(mb); s.appendChild(body); cats.appendChild(s);
  });
}).catch(function(e){
  document.getElementById('cats').innerHTML=
    '<p style="color:#C24545">데이터 로드 실패: '+esc(e.message)+'</p>';
});
</script>
