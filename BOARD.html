<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틴트윈 관제탑</title>
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#3D2B26; --sub:#8A7468; --line:#EADFD6;
  --ok:#2E9E5B; --css:#2B7DC7; --temp:#C98A1B; --queued:#7B6AC7; --empty:#C24545;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5;padding-bottom:60px}
main{max-width:46rem;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:8px 0 2px}
.updated{color:var(--sub);font-size:.8rem;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:.75rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#FFF}
.chip b{font-variant-numeric:tabular-nums}

section.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
section.cat>h2{font-size:1rem;margin:0;padding:13px 15px;background:#F6EDE2;border-bottom:1px solid var(--line)}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{cursor:pointer;padding:11px 15px;font-weight:700;font-size:.88rem;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';color:var(--sub);transition:.15s}
details[open] summary::before{transform:rotate(90deg)}
summary .cnt{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 12px 14px}
.acard{border:1px solid var(--line);border-radius:11px;background:#FDFAF6;overflow:hidden;display:flex;flex-direction:column}
.acard.st-empty{border:2px dashed var(--empty);background:#FCF3F3}
.thumb{height:74px;display:flex;align-items:center;justify-content:center;background:
  conic-gradient(#EFE7DC 25%,#F8F2EA 0 50%,#EFE7DC 0 75%,#F8F2EA 0) 0 0/16px 16px;position:relative}
.thumb img{max-width:92%;max-height:66px;object-fit:contain}
.thumb.bgimg{background:#2B2320}
.thumb.bgimg img{max-width:100%;max-height:74px;object-fit:cover;width:100%}
.thumb .ph{font-size:.66rem;color:var(--sub);text-align:center;padding:4px}
.st-empty .thumb .ph{color:var(--empty);font-weight:700}
.tbadge{position:absolute;left:4px;top:4px;font-size:.58rem;padding:1px 6px;border-radius:6px;color:#FFF;background:#8A7468}
.tbadge.bg{background:#3E5E43;left:0;top:0;right:0;border-radius:0;text-align:center;font-size:.62rem;padding:2px 0}
.tbadge.code{background:#5B7B9E}.tbadge.motion{background:#9E5B8E}.tbadge.plan{background:#7d7d7d}
.meta{padding:6px 7px 7px;font-size:.7rem;line-height:1.3}
.meta .nm{display:block;font-weight:700}
.meta .nt{display:block;color:var(--temp);font-size:.62rem;margin-top:2px}
.sdot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:4px}
.s-ok{background:var(--ok)}.s-css{background:var(--css)}.s-temp{background:var(--temp)}.s-queued{background:var(--queued)}.s-empty{background:var(--empty)}
.slab{font-size:.62rem;color:var(--sub)}

/* 라이브 데모 (게임 본판 캔디 CSS 이식 — 기준 e7a7a66) */
.live{width:92%;height:auto}
.d-mbtn{position:relative;width:94%;height:30px;border:0;border-radius:7.3px;color:#FFF;font-weight:800;font-size:11px;font-family:inherit;
  background:linear-gradient(180deg,var(--crt) 4%,var(--crt) 12%,var(--cl) 20%,var(--clb) 48%,var(--cb) 57%,var(--cbb) 68%,var(--crb) 78%,var(--crb) 87%,var(--cd) 89%,var(--cdd) 100%);
  box-shadow:0 2.5px 0 var(--cp),inset 0 0 0 2px var(--co);text-shadow:0 1px 0 rgba(110,70,58,.5)}
.d-mbtn:active{transform:translateY(2px)}
.mbtn-p{--crt:#FEA4BE;--cl:#F8AAC5;--clb:#F797B2;--cb:#F98FAA;--cbb:#E97D98;--crb:#FFB3CA;--cd:#AD4972;--cdd:#812B4A;--co:#672124;--cp:#651D2A}
.mbtn-v{--crt:#CEADFF;--cl:#BC94F4;--clb:#B084E0;--cb:#A573EE;--cbb:#A571ED;--crb:#C694FF;--cd:#8E58D0;--cdd:#855AC4;--co:#5C3E96;--cp:#413575}
.mbtn-y{--crt:#FAD879;--cl:#FBD86A;--clb:#F5C152;--cb:#F4BC50;--cbb:#EBB551;--crb:#FFD764;--cd:#DD913A;--cdd:#D59032;--co:#75642A;--cp:#75642A}
.mbtn-o{--crt:#E9A784;--cl:#E08E5F;--clb:#E08454;--cb:#E08554;--cbb:#E18653;--crb:#F5AA83;--cd:#9D5839;--cdd:#8E5843;--co:#6F422F;--cp:#693D28}
.d-mode{width:94%;height:26px;border:0;border-radius:8px;color:#FFF;font-weight:800;font-size:10px;font-family:inherit;
  background:linear-gradient(180deg,var(--a) 10%,var(--b) 55%,var(--c) 90%);box-shadow:0 2px 0 var(--d),inset 0 0 0 2px var(--d)}
.d-mode:active{transform:translateY(1.5px)}
.mode-1{--a:#F8A0BC;--b:#EE7396;--c:#D95C80;--d:#A82E4D}.mode-2{--a:#C7A2F5;--b:#A97BE8;--c:#9463D6;--d:#5C3E96}
.mode-3{--a:#7FDCB2;--b:#4EC493;--c:#3BAF7F;--d:#1F6B52}.mode-4{--a:#FBD86A;--b:#F4BC50;--c:#E8A93F;--d:#8A5510}
.d-panel{width:88%;height:56px;background:#FBEFDD;border-radius:10px;box-shadow:inset 0 0 0 2px #E9CBA8}
.d-pophead{width:80%;padding:6px 0;text-align:center;color:#FFF;font-weight:800;font-size:10px;border-radius:8px;
  background:linear-gradient(180deg,#FBA9C4 8%,#F58BAB 45%,#EE7396 70%,#C24868 92%);box-shadow:0 2px 0 #8F2643,inset 0 0 0 2px #A82E4D}
.d-tgl{border:0;border-radius:8px;padding:5px 14px;color:#FFF;font-weight:800;font-size:10px;font-family:inherit;
  background:linear-gradient(180deg,#9BB8F0 8%,#6E92E4 55%,#5878C9 90%);box-shadow:0 2px 0 #34477E,inset 0 0 0 2px #45579B}
.d-tgl.off{filter:grayscale(.7) brightness(.9)}
.d-scrim{width:86%;background:rgba(46,26,40,.85);border-radius:99px;padding:6px 0;text-align:center}
.d-breathe{color:#FFDFEB;font-weight:800;font-size:10px;animation:br 1.7s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1;text-shadow:0 0 5px rgba(255,143,184,.8)}50%{opacity:.6}}
.d-bubble{width:90%;background:rgba(40,30,45,.85);color:#FFF;border-radius:99px;font-size:8.5px;text-align:center;padding:5px 2px}

.bottom{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bottom h2{font-size:.92rem;margin:0 0 8px}
ol.queue{margin:0;padding-left:20px;font-size:.84rem}
.commits{font-family:Consolas,monospace;font-size:.74rem;line-height:1.85;overflow-x:auto;white-space:nowrap}
.commits b{color:#B0682A}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);text-decoration:none;background:#FDFAF6}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--sub);margin-bottom:12px}
</style>
</head>
<body>
<main>
<h1>🗼 틴트윈 관제탑 — 에셋 카탈로그</h1>
<div class="updated" id="updated"></div>
<div class="chips" id="chips"></div>
<div class="legend">
  <span><span class="sdot s-ok"></span>확보</span><span><span class="sdot s-css"></span>CSS 구현</span>
  <span><span class="sdot s-temp"></span>임시·구판</span><span><span class="sdot s-queued"></span>발주·예약</span>
  <span><span class="sdot s-empty"></span>빈 슬롯</span>
  <span>｜ 카드 왼쪽 위 배지 = 유형(배경/코드/모션/기획)</span>
</div>

<div id="cats"></div>

<div class="bottom"><h2>발주 대기열</h2><ol class="queue" id="queue"></ol></div>
<div class="bottom"><h2>최근 커밋</h2>
  <div style="color:var(--sub);font-size:.76rem;margin-bottom:6px">표에 적은 것이 아니라 <b>커밋된 것</b>이 끝난 것이다.</div>
  <div class="commits" id="commits"></div></div>
<div class="bottom"><h2>바로가기</h2><div class="links" id="links"></div></div>
</main>

<script>
const SD={ok:'s-ok',css:'s-css',temp:'s-temp',queued:'s-queued',empty:'s-empty'};
const SL={ok:'확보',css:'CSS',temp:'임시',queued:'발주·예약',empty:'빈칸'};
const TB={bg:'배경',code:'코드',motion:'모션',plan:'기획'};

Promise.all([
  fetch('board-data.json?v='+Date.now()).then(r=>r.json()),
  fetch('catalog/manifest.json?v='+Date.now()).then(r=>r.json())
]).then(([D,M])=>{
  document.getElementById('updated').textContent='갱신 '+D.updated+' · 푸시마다 이 판이 갱신됩니다';

  let tot=0,c={ok:0,css:0,temp:0,queued:0,empty:0};
  D.sections.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>{tot++;c[it[2]]++;})));
  document.getElementById('chips').innerHTML=
    `<span class="chip">전체 <b>${tot}</b></span><span class="chip">✅ 확보 <b>${c.ok}</b></span>`+
    `<span class="chip">🔵 CSS <b>${c.css}</b></span><span class="chip">🟡 임시 <b>${c.temp}</b></span>`+
    `<span class="chip">📋 발주·예약 <b>${c.queued}</b></span><span class="chip">⬜ 빈칸 <b>${c.empty}</b></span>`;

  const LIVE={
    'scrim':'<div class="d-scrim"><span style="color:#FFDFEB;font-weight:800;font-size:10px">화면을 터치하세요</span></div>',
    'breathe':'<div class="d-scrim"><span class="d-breathe">화면을 터치하세요</span></div>',
    'bubble':'<div class="d-bubble">같은 숫자, 또는 합이 10인 짝을 지우세요.</div>',
    'mbtn-p':'<button class="d-mbtn mbtn-p">시작하기</button>','mbtn-v':'<button class="d-mbtn mbtn-v">이어하기</button>',
    'mbtn-y':'<button class="d-mbtn mbtn-y">캐릭터</button>','mbtn-o':'<button class="d-mbtn mbtn-o">설정</button>',
    'mode-1':'<button class="d-mode mode-1">모험</button>','mode-2':'<button class="d-mode mode-2">아케이드</button>',
    'mode-3':'<button class="d-mode mode-3">데일리</button>','mode-4':'<button class="d-mode mode-4">타임 러시</button>',
    'panel':'<div class="d-panel"></div>','pophead':'<div class="d-pophead">플레이</div>',
    'tgl':'<button class="d-tgl" onclick="this.classList.toggle(\'off\');this.textContent=this.classList.contains(\'off\')?\'꺼짐\':\'켜짐\'">켜짐</button>'
  };

  const cats=document.getElementById('cats');
  D.sections.forEach(sec=>{
    const s=document.createElement('section'); s.className='cat';
    s.innerHTML='<h2>'+sec.title+'</h2>';
    sec.groups.forEach((g,gi)=>{
      const filled=g.items.filter(it=>it[2]==='ok'||it[2]==='css').length;
      const det=document.createElement('details');
      if(gi===0)det.open=true;
      det.innerHTML=`<summary>${g.name}<span class="cnt">${filled}/${g.items.length}</span></summary>`;
      const grid=document.createElement('div'); grid.className='grid';
      g.items.forEach(it=>{
        const [nm,ty,st,ref,note]=it;
        const card=document.createElement('div'); card.className='acard st-'+st;
        let thumb='';
        if(ref&&ref.startsWith('img:')){
          const key=ref.slice(4), f=M[key];
          if(f) thumb=`<div class="thumb${ty==='bg'?' bgimg':''}"><img loading="lazy" src="catalog/${f.file}" alt="${nm}"></div>`;
          else  thumb=`<div class="thumb"><span class="ph">실물 미연결<br>(${key})</span></div>`;
        } else if(ref&&ref.startsWith('live:')&&LIVE[ref.slice(5)]){
          thumb=`<div class="thumb">${LIVE[ref.slice(5)]}</div>`;
        } else if(st==='empty'){
          thumb='<div class="thumb"><span class="ph">없음</span></div>';
        } else if(st==='queued'){
          thumb='<div class="thumb"><span class="ph">발주·예약</span></div>';
        } else {
          thumb='<div class="thumb"><span class="ph">코드·CSS</span></div>';
        }
        card.innerHTML=thumb+
          (ty!=='asset'?`<span class="tbadge ${ty}">${TB[ty]}</span>`:'')+
          `<div class="meta"><span class="nm">${nm}</span>`+
          `<span><span class="sdot ${SD[st]}"></span><span class="slab">${SL[st]}</span></span>`+
          (note?`<span class="nt">${note}</span>`:'')+`</div>`;
        card.style.position='relative';
        grid.appendChild(card);
      });
      det.appendChild(grid); s.appendChild(det);
    });
    cats.appendChild(s);
  });

  document.getElementById('queue').innerHTML=D.queue.map(q=>`<li>${q}</li>`).join('');
  document.getElementById('commits').innerHTML=D.commits.map(c=>`<b>${c[0]}</b>  ${c[1]}`).join('<br>');
  document.getElementById('links').innerHTML=D.links.map(l=>`<a href="${l[1]}">${l[0]}</a>`).join('');
}).catch(e=>{
  document.getElementById('cats').innerHTML='<p style="color:#C24545">데이터 로드 실패: '+e.message+'</p>';
});
</script>
</body>
</html>
