<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틴트윈 관제탑</title>
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#3D2B26; --sub:#8A7468; --line:#EADFD6;
  --ok:#2E9E5B; --css:#2B7DC7; --temp:#C98A1B; --queued:#7B6AC7; --empty:#C24545;
  --dark:#2B2320;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:64rem;margin:0 auto;padding:12px}

/* ── 1. 제목 ── */
h1{font-size:1.35rem;margin:8px 0 10px}

/* ── 2. 분류 필터 (sticky 한 줄) ── */
.filters{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 9px;margin-bottom:16px;
  border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.fb{font-family:inherit;font-size:.78rem;padding:5px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:#FFF;color:var(--ink)}
.fb:hover{border-color:var(--sub)}
.fb.on{background:var(--ink);color:#FFF;border-color:var(--ink)}

/* ── 3-A. 섹션 (큰 번호 제목) ── */
section.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin-bottom:22px;overflow:hidden}
section.cat>h2{font-size:1.14rem;margin:0;padding:15px 16px;background:#F1E3D3;
  border-bottom:2px solid #E0CDB6;display:flex;align-items:center;gap:10px;letter-spacing:.01em}
section.cat>h2 .rn{display:inline-flex;align-items:center;justify-content:center;
  min-width:2.1em;height:2.1em;border-radius:50%;background:var(--ink);color:#FFF;
  font-size:.86rem;font-weight:800;flex:0 0 auto}

.secbody{display:flex;align-items:flex-start}

/* ── 3-B. 배경 사이드 (분리) ── */
.side{flex:0 0 180px;width:180px;align-self:flex-start;position:sticky;top:56px;
  padding:12px 10px;background:#F6EDE2;border-right:1px solid var(--line)}
.sidehead{font-size:.72rem;font-weight:800;color:var(--sub);letter-spacing:.08em;margin-bottom:8px}
.bgcard{background:var(--dark);border:2px solid #1C1614;border-radius:10px;overflow:hidden;margin-bottom:10px}
.bgcard.st-empty{border:2px dashed var(--empty)}
.bgcard .band{background:#3E5E43;color:#FFF;font-size:.6rem;font-weight:700;text-align:center;padding:2px 0}
.bgcard img{width:100%;height:76px;object-fit:cover;display:block}
.bgcard .bgph{height:76px;display:flex;align-items:center;justify-content:center;
  color:#B9A99C;font-size:.66rem;background:#231D1A}
.bgcard .bmeta{padding:5px 6px 6px;color:#F3E9DF;font-size:.66rem;line-height:1.35}
.bgcard .bmeta .slab2{color:#C9B9AC;font-size:.6rem}

/* ── 3-C. 그룹 (굵은 헤더) ── */
.mainbody{flex:1 1 auto;min-width:0}
details.grp{border-top:1px solid var(--line);border-left:4px solid #E9D7BE}
details.grp:first-child{border-top:0}
details.grp>summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:.95rem;
  list-style:none;display:flex;align-items:center;gap:8px;background:#FCF7F1}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--sub);font-weight:400;transition:.15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
summary .cnt{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--sub);
  font-variant-numeric:tabular-nums}

/* ── 3-D. 부품 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:10px 12px 15px}
.acard{position:relative;border:1px solid var(--line);border-radius:11px;background:#FDFAF6;
  overflow:hidden;display:flex;flex-direction:column}
.acard.st-empty{border:2px dashed var(--empty);background:#FCF3F3}
.thumb{height:74px;display:flex;align-items:center;justify-content:center;position:relative;
  background:conic-gradient(#EFE7DC 25%,#F8F2EA 0 50%,#EFE7DC 0 75%,#F8F2EA 0) 0 0/16px 16px}
.thumb img{max-width:92%;max-height:66px;object-fit:contain}
.thumb .ph{font-size:.66rem;color:var(--sub);text-align:center;padding:4px}
.st-empty .thumb .ph{color:var(--empty);font-weight:700}
.tbadge{position:absolute;left:4px;top:4px;font-size:.58rem;padding:1px 6px;border-radius:6px;
  color:#FFF;background:#8A7468;z-index:2}
.tbadge.bg{background:#3E5E43}.tbadge.code{background:#5B7B9E}
.tbadge.motion{background:#9E5B8E}.tbadge.plan{background:#7D7D7D}
.dbadge{position:absolute;right:4px;top:4px;font-size:.56rem;padding:1px 5px;border-radius:6px;
  color:#4A3208;background:#FBD86A;font-weight:700;z-index:2}
.meta{padding:6px 7px 7px;font-size:.7rem;line-height:1.3}
.meta .nm{display:block;font-weight:700}
.meta .nt{display:block;color:var(--temp);font-size:.62rem;margin-top:2px}
.sdot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:4px}
.s-ok{background:var(--ok)}.s-css{background:var(--css)}.s-temp{background:var(--temp)}
.s-queued{background:var(--queued)}.s-empty{background:var(--empty)}
.slab{font-size:.62rem;color:var(--sub)}

/* ── 4. 그룹 안 조립 화면 미리보기 (한 번에 하나만 산다) ── */
.gbody{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 15px}
.gbody>.grid{flex:1 1 auto;min-width:0;padding:0}
.pv{flex:0 0 214px;width:214px}
.pvbtn{width:100%;font-family:inherit;font-size:.74rem;padding:11px 6px;border-radius:11px;
  border:1px dashed var(--sub);background:#FCF7F1;color:var(--sub);cursor:pointer}
.pvbtn:hover{border-color:var(--ink);color:var(--ink)}
.bgcard.pick{cursor:pointer}
.bgcard.sel{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.phonewrap{position:relative;overflow:hidden}
.phone{width:390px;height:844px;transform-origin:top left;border:8px solid var(--ink);
  border-radius:30px;overflow:hidden;background:#000}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#FFF}

/* ── 5. 밤샘 작업 일지 ── */
#worklog{margin-bottom:22px}
.logday{background:var(--card);border:1px solid var(--line);border-radius:16px;
  margin-bottom:18px;overflow:hidden}
.logday>h2{font-size:1.06rem;margin:0;padding:13px 16px;background:#F1E3D3;
  border-bottom:2px solid #E0CDB6;display:flex;align-items:center;gap:9px}
.logday>h2 .moon{font-size:1.1rem}
.logday>h2 .cnt{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--sub);
  font-variant-numeric:tabular-nums}
.logitem{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
  border-left:4px solid #E9D7BE;background:#FCF7F1}
.logitem:first-of-type{border-top:0}
.logitem .when{flex:0 0 62px;font-size:.74rem;font-weight:800;color:var(--sub);
  font-variant-numeric:tabular-nums;padding-top:1px}
.logitem .core{flex:1 1 auto;min-width:0}
.logitem .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.wv{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;color:#FFF;
  background:var(--queued)}
.logitem .ttl{font-weight:800;font-size:.93rem}
.stt{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#FFF}
.stt.done{background:var(--ok)}.stt.doing{background:var(--css)}.stt.hold{background:var(--temp)}
.logitem ul{margin:0;padding-left:17px;font-size:.78rem;line-height:1.55;color:#4E3A33}
.logitem .sha{display:inline-block;margin-top:5px;font-size:.66rem;color:var(--sub);
  font-family:ui-monospace,Consolas,monospace;background:#F1E7DC;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}
.logempty{padding:16px;color:var(--sub);font-size:.8rem}
@media (max-width:720px){
  .logitem{display:block}
  .logitem .when{margin-bottom:3px}
}

/* ── 좁은 화면: 사이드 → 가로 스크롤 줄 ── */
@media (max-width:720px){
  .secbody{display:block}
  .side{position:static;width:auto;flex:none;display:flex;gap:8px;align-items:flex-start;
    overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .sidehead{flex:0 0 auto;margin:0;align-self:center;writing-mode:horizontal-tb}
  .bgcard{flex:0 0 132px;width:132px;margin-bottom:0}
  .bgcard img,.bgcard .bgph{height:64px}
  .gbody{display:block}
  .pv{flex:none;width:auto;max-width:390px;margin-top:10px}
}
</style>
</head>
<body>
<main>
<h1>🗼 틴트윈 관제탑</h1>
<div class="filters" id="filters"></div>
<div id="worklog" hidden></div>
<div id="cats"></div>
</main>

<script>
const SD={ok:'s-ok',css:'s-css',temp:'s-temp',queued:'s-queued',empty:'s-empty'};
const SL={ok:'확보',css:'CSS',temp:'임시',queued:'발주·예약',empty:'빈칸'};
const TB={bg:'배경',code:'코드',motion:'모션',plan:'기획'};
const TABS=[['all','전체'],['bg','배경'],['char','캐릭터'],['fruit','과일'],
            ['fx','효과'],['ui','인터페이스'],['time','시간'],['dyn','⚡동적'],
            ['log','🌙 밤샘 일지']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M={};

function thumbHTML(ref,st){
  if(ref&&ref.indexOf('img:')===0){
    const key=ref.slice(4),f=M[key];
    if(f) return '<div class="thumb"><img loading="lazy" src="catalog/'+f.file+'" alt=""></div>';
    return '<div class="thumb"><span class="ph">실물 미연결<br>('+esc(key)+')</span></div>';
  }
  if(st==='empty')  return '<div class="thumb"><span class="ph">없음</span></div>';
  if(st==='queued') return '<div class="thumb"><span class="ph">발주·예약</span></div>';
  return '<div class="thumb"><span class="ph">코드·CSS</span></div>';
}

function mkCard(it){
  const nm=it[0],ty=it[1],st=it[2],ref=it[3],note=it[4],cls=it[5],dyn=it[6];
  const el=document.createElement('div');
  el.className='acard st-'+st;
  el.dataset.cls=cls; el.dataset.dyn=dyn;
  el.innerHTML=thumbHTML(ref,st)
    +(ty!=='asset'?'<span class="tbadge '+ty+'">'+TB[ty]+'</span>':'')
    +(dyn?'<span class="dbadge">⚡동적</span>':'')
    +'<div class="meta"><span class="nm">'+esc(nm)+'</span>'
    +'<span><span class="sdot '+SD[st]+'"></span><span class="slab">'+SL[st]+'</span></span>'
    +(note?'<span class="nt">'+esc(note)+'</span>':'')+'</div>';
  return el;
}

function mkBgCard(it,si){
  const nm=it[0],st=it[2],ref=it[3],dyn=it[6];
  const el=document.createElement('div');
  el.className='bgcard st-'+st;
  el.dataset.cls='bg'; el.dataset.dyn=dyn; el.dataset.si=String(si);
  const f=(ref&&ref.indexOf('img:')===0)?M[ref.slice(4)]:null;
  if(f){ el.classList.add('pick'); el.dataset.bg=ref.slice(4);
         el.addEventListener('click',function(){ pickBg(el); }); }
  el.innerHTML='<div class="band">배경</div>'
    +(f?'<img loading="lazy" src="catalog/'+f.file+'" alt="">'
       :'<div class="bgph">'+(st==='empty'?'없음':st==='queued'?'발주·예약':'코드·CSS')+'</div>')
    +'<div class="bmeta">'+esc(nm)+'<br><span class="sdot '+SD[st]+'"></span>'
    +'<span class="slab2">'+SL[st]+'</span></div>';
  return el;
}

/* ── 조립 화면 미리보기 ───────────────────────────────────────────────
   ACT 는 지금 살아 있는 미리보기 하나(폰 성능 보호 — 동시 1개만).
   SECBG[si] 는 그 섹션에서 고른 배경 키(없으면 게임 기본 배경). */
let ACT=null; const SECBG={};

function srcFor(scr,bg){
  const q=[];
  if(scr&&scr!=='splash') q.push('screen='+encodeURIComponent(scr));
  if(bg) q.push('bg='+encodeURIComponent(bg));
  return 'tentwin.html'+(q.length?'?'+q.join('&'):'');
}

function mkPreview(scr,si){
  const pv=document.createElement('div'); pv.className='pv';
  pv.dataset.scr=scr; pv.dataset.si=String(si);
  resetPv(pv);
  return pv;
}

function resetPv(pv){
  pv.innerHTML='<button class="pvbtn" type="button">▶ 조립 화면 보기</button>';
  pv.querySelector('.pvbtn').addEventListener('click',function(){ openPv(pv); });
  if(ACT&&ACT.pv===pv) ACT=null;
}

function openPv(pv){
  if(ACT&&ACT.pv!==pv) resetPv(ACT.pv);          /* 다른 미리보기는 내린다 */
  const scr=pv.dataset.scr, si=pv.dataset.si;
  pv.innerHTML='<div class="phonewrap"><div class="phone"><iframe title="조립 화면" src="'
    +esc(srcFor(scr,SECBG[si]))+'"></iframe></div></div>';
  ACT={pv:pv,scr:scr,si:si};
  fitPv();
}

function fitPv(){
  if(!ACT) return;
  const wrap=ACT.pv.querySelector('.phonewrap'), ph=ACT.pv.querySelector('.phone');
  if(!wrap||!ph) return;
  const s=Math.min(1,wrap.clientWidth/390);
  ph.style.transform='scale('+s+')';
  wrap.style.height=(844*s)+'px';
}
window.addEventListener('resize',fitPv);

/* 사이드 배경 카드 = 배경 선택 버튼. 같은 카드를 다시 누르면 기본 배경으로. */
function pickBg(card){
  const si=card.dataset.si, k=card.dataset.bg;
  const next=(SECBG[si]===k)?null:k;
  SECBG[si]=next;
  card.parentNode.querySelectorAll('.bgcard').forEach(x=>x.classList.remove('sel'));
  if(next) card.classList.add('sel');
  if(ACT&&ACT.si===si){
    const fr=ACT.pv.querySelector('iframe');
    if(fr) fr.src=srcFor(ACT.scr,next);
  }else{
    const first=document.querySelector('.pv[data-si="'+si+'"]');
    if(first) openPv(first);                     /* 없으면 이 섹션 첫 화면을 연다 */
  }
}

/* ── 밤샘 작업 일지 ─────────────────────────────────────────────────
   board-data.json 의 worklog 배열만 읽는다. 항목 1개를 append 하면 바로 뜬다.
   { t:"2026-08-20 02:10", wave:"W0", title:"...", summary:["..."],
     status:"완료|진행|보류", commit:"0704500" }                            */
const STC={'완료':'done','진행':'doing','보류':'hold'};

function dayLabel(t){
  const d=String(t).slice(0,10), h=parseInt(String(t).slice(11,13),10);
  const band=(isNaN(h)||h>=18||h<6)?'밤':'낮';
  return d+' '+band;
}

function mkLogItem(e){
  const el=document.createElement('article'); el.className='logitem';
  const sum=Array.isArray(e.summary)?e.summary:(e.summary?[e.summary]:[]);
  el.innerHTML='<div class="when">'+esc(String(e.t||'').slice(11)||'—')+'</div>'
    +'<div class="core"><div class="hd">'
    +(e.wave?'<span class="wv">'+esc(e.wave)+'</span>':'')
    +'<span class="ttl">'+esc(e.title||'')+'</span>'
    +'<span class="stt '+(STC[e.status]||'doing')+'">'+esc(e.status||'진행')+'</span>'
    +'</div>'
    +(sum.length?'<ul>'+sum.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')
    +(e.commit?'<span class="sha">'+esc(e.commit)+'</span>':'')
    +'</div>';
  return el;
}

function renderWorklog(list){
  const box=document.getElementById('worklog');
  box.innerHTML='';
  const L=(list||[]).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  if(!L.length){ box.innerHTML='<div class="logday"><div class="logempty">아직 기록이 없습니다.</div></div>'; return; }
  let cur=null, day=null;
  L.forEach(function(e){
    const lb=dayLabel(e.t);
    if(lb!==day){
      day=lb;
      cur=document.createElement('section'); cur.className='logday';
      cur.innerHTML='<h2><span class="moon">🌙</span>'+esc(lb)+'<span class="cnt"></span></h2>';
      box.appendChild(cur);
    }
    cur.appendChild(mkLogItem(e));
    cur.querySelector('.cnt').textContent=cur.querySelectorAll('.logitem').length+'건';
  });
}

function showLog(on){
  document.getElementById('worklog').hidden=!on;
  document.getElementById('cats').style.display=on?'none':'';
}

function applyFilter(f){
  document.querySelectorAll('.acard,.bgcard').forEach(function(c){
    const on = f==='all' ? true
             : f==='dyn' ? c.dataset.dyn==='1'
             : c.dataset.cls===f;
    c.style.display = on ? '' : 'none';
  });
  document.querySelectorAll('section.cat').forEach(function(sec){
    let live=0;
    sec.querySelectorAll('details.grp').forEach(function(d){
      let n=0;
      d.querySelectorAll('.acard').forEach(c=>{ if(c.style.display!=='none') n++; });
      d.style.display = n ? '' : 'none';
      live+=n;
    });
    const side=sec.querySelector('.side');
    if(side){
      let n=0;
      side.querySelectorAll('.bgcard').forEach(c=>{ if(c.style.display!=='none') n++; });
      side.style.display = n ? '' : 'none';
      live+=n;
    }
    sec.style.display = live ? '' : 'none';
  });
}

Promise.all([
  fetch('board-data.json?v='+Date.now()).then(r=>r.json()),
  fetch('catalog/manifest.json?v='+Date.now()).then(r=>r.json())
]).then(function(res){
  const D=res[0]; M=res[1];

  const fbox=document.getElementById('filters');
  TABS.forEach(function(t,i){
    const b=document.createElement('button');
    b.className='fb'+(i===0?' on':''); b.textContent=t[1]; b.dataset.f=t[0];
    b.addEventListener('click',function(){
      fbox.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(t[0]==='log'){ showLog(true); return; }
      showLog(false); applyFilter(t[0]);
    });
    fbox.appendChild(b);
  });

  renderWorklog(D.worklog);

  const cats=document.getElementById('cats');
  D.sections.forEach(function(sec,si){
    const s=document.createElement('section'); s.className='cat';
    const m=sec.title.match(/^([Ⅰ-Ⅶ]+)\.\s*(.*)$/);
    const h=document.createElement('h2');
    h.innerHTML = m ? '<span class="rn">'+esc(m[1])+'</span>'+esc(m[2]) : esc(sec.title);
    s.appendChild(h);

    const body=document.createElement('div'); body.className='secbody';
    const bgItems=[];
    sec.groups.forEach(g=>g.items.forEach(it=>{ if(it[5]==='bg') bgItems.push(it); }));

    if(bgItems.length){
      const side=document.createElement('aside'); side.className='side';
      side.innerHTML='<div class="sidehead">배경</div>';
      bgItems.forEach(it=>side.appendChild(mkBgCard(it,si)));
      body.appendChild(side);
    }

    const mb=document.createElement('div'); mb.className='mainbody';
    sec.groups.forEach(function(g){
      const items=g.items.filter(it=>it[5]!=='bg');   /* 배경은 사이드 전용 */
      if(!items.length) return;
      const det=document.createElement('details'); det.className='grp'; det.open=true;
      const filled=items.filter(it=>it[2]==='ok'||it[2]==='css').length;
      det.innerHTML='<summary>'+esc(g.name)
        +'<span class="cnt">'+filled+'/'+items.length+'</span></summary>';
      const gb=document.createElement('div'); gb.className='gbody';
      const grid=document.createElement('div'); grid.className='grid';
      items.forEach(it=>grid.appendChild(mkCard(it)));
      gb.appendChild(grid);
      if(g.scr) gb.appendChild(mkPreview(g.scr,si));   /* 화면에 대응하는 그룹만 */
      det.appendChild(gb);
      det.addEventListener('toggle',function(){
        if(!det.open&&ACT&&det.contains(ACT.pv)) resetPv(ACT.pv);
      });
      mb.appendChild(det);
    });

    body.appendChild(mb); s.appendChild(body); cats.appendChild(s);
  });
}).catch(function(e){
  document.getElementById('cats').innerHTML=
    '<p style="color:#C24545">데이터 로드 실패: '+esc(e.message)+'</p>';
});
</script>
</body>
</html>
