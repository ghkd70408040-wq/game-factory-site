<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>TenTwin</title>
<style>

<body><div id="bg"></div><div id="col"><iframe id="game" title="TenTwin" allow="autoplay; fullscreen; clipboard-write; web-share" allowfullscreen></iframe></div>
<script>
(function(){
  var f=document.getElementById('game');

  f.addEventListener('load',function(){try{f.contentWindow.focus();}catch(e){}});

</script></body></html>
