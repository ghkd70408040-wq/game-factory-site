<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>틴트윈 사운드 오디션 (단일 파일)</title>
<!-- 빈 data: 파비콘 — 브라우저가 자동으로 /favicon.ico 를 때리는 것을 막는다(외부 요청 0 유지) -->
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#13111c;color:#ece9f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.5;
  /* 하단 고정 FAB 2개가 마지막 콘텐츠를 영구히 가리지 않도록 여백 확보 */
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto;padding:0 12px}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(19,17,28,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid #302a44;
  padding:10px 12px calc(8px + env(safe-area-inset-top,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
header .hrow{display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto}
h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1}
h1 small{display:block;font-size:11px;font-weight:500;color:#9d94b8;letter-spacing:0}
.prog{font-size:12px;color:#c7bfe4;background:#2a2440;border-radius:999px;padding:5px 10px;white-space:nowrap}
.prog b{color:#b6f36a}

/* ---- unlock banner ---- */
#unlock{
  position:fixed;inset:0;z-index:100;
  background:rgba(12,10,20,.97);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  padding:28px;text-align:center;
}
#unlock h2{font-size:22px;margin:0}
#unlock p{color:#a79fc4;font-size:14px;margin:0;max-width:300px}
#unlock button{
  min-height:60px;padding:0 34px;font-size:18px;font-weight:800;
  background:linear-gradient(180deg,#b6f36a,#8fd83f);color:#17240a;
  border:0;border-radius:16px;cursor:pointer;
}
#unlock.done{display:none}

/* ---- filters ---- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.filters button{
  flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;
  background:#241f36;color:#c3bade;border:1px solid #362f52;font-size:13px;font-weight:600;cursor:pointer;
}
.filters button.on{background:#b6f36a;color:#17240a;border-color:#b6f36a}

/* ---- slot card ---- */
.card{background:#1d1930;border:1px solid #2f2949;border-radius:14px;margin:10px 0;overflow:hidden}
.card.hide{display:none}
.chead{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 8px}
.chead .t{flex:1;min-width:0}
.chead .ko{font-size:16px;font-weight:800;letter-spacing:-.02em}
.chead .id{font-size:11px;color:#8b82a8;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;white-space:nowrap}
.b-p0{background:#ff6b8a;color:#2a0a12}
.b-p1{background:#ffc857;color:#2e2000}
.b-p2{background:#4a4266;color:#cfc7e6}
.b-new{background:#ff4d4d;color:#fff}
.b-done{background:#b6f36a;color:#17240a}
.meta{padding:0 12px 8px;font-size:12px;color:#9d94b8}
.meta div{margin:2px 0}
.meta b{color:#c9c0e6;font-weight:600}

/* ---- candidate rows ---- */
.cands{padding:2px 8px 8px}
.cand{display:flex;align-items:stretch;gap:6px;margin:6px 0}
.play{
  flex:1;min-height:56px;display:flex;align-items:center;gap:10px;
  background:#2a2440;border:1px solid #3a3259;border-radius:12px;
  color:#ece9f5;text-align:left;padding:8px 10px;cursor:pointer;position:relative;overflow:hidden;
  font-family:inherit;font-size:13px;
}
.play .lt{
  flex:0 0 32px;height:32px;border-radius:9px;background:#3d3463;color:#dcd4f5;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
}
.play .dt{flex:1;min-width:0}
.play .dsc{display:block;color:#cfc7e6;line-height:1.35;font-size:12.5px}
.play .num{display:block;color:#857ca4;font-size:11px;margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace}
.play.playing{border-color:#b6f36a;background:#33406b}
.play.playing .lt{background:#b6f36a;color:#17240a}
.play .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#b6f36a;transition:width .05s linear}
.pick{
  flex:0 0 56px;min-height:56px;border-radius:12px;
  background:#241f36;border:1px solid #3a3259;color:#6f6690;
  font-size:22px;cursor:pointer;font-family:inherit;
}
.pick.on{background:#b6f36a;border-color:#b6f36a;color:#17240a}

/* ---- extra rows ---- */
.xrow{display:flex;gap:6px;padding:2px 8px 8px;flex-wrap:wrap}
.xbtn{
  flex:1 1 auto;min-height:46px;padding:0 12px;border-radius:11px;
  background:#2a2440;border:1px solid #3a3259;color:#dcd4f5;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.xbtn.lemon{background:#3b3a1e;border-color:#6d6a2f;color:#f0eba8}
.xbtn.playing{border-color:#b6f36a;background:#33406b}
.xbtn[disabled]{opacity:.4;cursor:default}
.xbtn.warn{background:#3a1e26;border-color:#6d2f3f;color:#ffb8c6}
.vrow{display:flex;gap:6px;padding:0 8px 10px}
.vbtn{
  flex:1;min-height:46px;border-radius:11px;
  background:#241f36;border:1px solid #3a3259;color:#a79fc4;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.vbtn.on{background:#ffc857;border-color:#ffc857;color:#2e2000}
.vbtn.rej.on{background:#ff6b8a;border-color:#ff6b8a;color:#2a0a12}

.slider{display:flex;align-items:center;gap:8px;padding:0 10px 10px;font-size:12px;color:#9d94b8}
.slider input{flex:1;height:34px}

/* ---- section ---- */
h2.sec{font-size:15px;margin:22px 0 2px;color:#b6f36a;letter-spacing:-.01em}
h2.sec span{color:#8b82a8;font-weight:500;font-size:12px}

/* ---- voice ---- */
.line{
  display:block;width:100%;min-height:52px;text-align:left;margin:6px 0;
  background:#2a2440;border:1px solid #3a3259;border-radius:11px;color:#ece9f5;
  padding:9px 11px;font-size:13px;cursor:pointer;font-family:inherit;line-height:1.4;
}
.line.playing{border-color:#b6f36a;background:#33406b}
.line em{display:block;font-style:normal;color:#857ca4;font-size:11px;margin-top:3px}

/* ---- result ---- */
#result{margin-top:26px;background:#1d1930;border:1px solid #3f3a5e;border-radius:14px;padding:12px}
#result h2{font-size:15px;margin:0 0 8px;color:#b6f36a}
#out{
  width:100%;min-height:150px;background:#0f0d17;color:#dcd4f5;
  border:1px solid #3a3259;border-radius:10px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;
  resize:vertical;-webkit-user-select:text;user-select:text;
}
#copy{
  width:100%;min-height:54px;margin-top:8px;border-radius:12px;border:0;
  background:linear-gradient(180deg,#b6f36a,#8fd83f);color:#17240a;
  font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;
}
#copy.ok{background:linear-gradient(180deg,#7ae8ff,#3fc4e0)}
.hint{font-size:11.5px;color:#857ca4;margin-top:8px;line-height:1.5}

/* ---- fab / toast ---- */
#fab{
  position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  min-height:50px;padding:0 16px;border-radius:999px;border:0;
  background:#b6f36a;color:#17240a;font-weight:800;font-size:14px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.45);font-family:inherit;
}
#stopfab{
  position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  min-height:50px;width:50px;border-radius:999px;border:0;display:none;
  background:#ff6b8a;color:#2a0a12;font-weight:800;font-size:18px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.45);font-family:inherit;
}
#stopfab.on{display:block}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:60;
  background:#2f2949;color:#ece9f5;padding:10px 16px;border-radius:10px;font-size:13px;
  opacity:0;transition:opacity .18s;pointer-events:none;max-width:88vw;text-align:center;
}
#toast.on{opacity:1}
footer{color:#6f6690;font-size:11px;text-align:center;margin:24px 0 8px;line-height:1.6}
</style>
</head>
<body>

<div id="unlock">
  <h2>🔊 사운드 오디션</h2>
  <p>모바일은 첫 터치 전에는 소리가 나지 않습니다.<br>아래를 눌러 오디오를 켜 주세요.</p>
  <button id="unlockBtn" type="button">소리 켜고 시작</button>
  <p style="font-size:12px">이어폰 권장 · 볼륨 미리 확인</p>
</div>

<header>
  <div class="hrow">
    <h1>틴트윈 사운드 오디션<small id="sub">SFX 22슬롯 · 60후보 · 단일 파일</small></h1>
    <div class="prog"><b id="pdone">0</b>/<span id="ptot">22</span></div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div id="slots"></div>

  <h2 class="sec">🗣️ 젤리어 보이스 데모 <span>— 캐릭터 옹알이 신스</span></h2>
  <div id="voice"></div>

  <div id="result">
    <h2>📋 결과 (톡 붙여넣기용)</h2>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <button id="copy" type="button">복사</button>
    <div class="hint">복사가 막히면 위 칸을 길게 눌러 전체 선택 후 복사하세요. 판정은 이 기기에 자동 저장됩니다.</div>
  </div>

  <footer id="foot"></footer>
</div>

<button id="stopfab" type="button" title="정지">■</button>
<button id="fab" type="button">결과 ↓</button>
<div id="toast"></div>

<script>/* =====================================================================
 * Jellyer — 틴트윈 "젤리어(옹알이)" 음성 시스템 코어 엔진
 * ---------------------------------------------------------------------
 * 개요
 *   동물의 숲 "동물어" 방식의 무의미 음절 발화 엔진.
 *   실제 의미는 자막이 전달하고, 오디오는 캐릭터별 피치·음색 프로필로
 *   대사 길이에 비례한 "옹알이"만 재생한다.
 *   톤 목표는 "젤리 팝": 칩튠(사각파 비프) 금지, 부드럽고 통통 튀는 느낌.
 *
 * 합성 방식 (단일 비프가 아니라 포먼트 합성)
 *   [성문 소스] sawtooth/triangle/square 오실레이터 + 프레임 단위 피치 지터
 *      └ (+ 서브하모닉 osc, roughness 용)
 *      └ (+ 필터링된 화이트노이즈, breathiness 용)
 *   → [포먼트 필터] BiquadFilter 'peaking' 3단 직렬 (F1/F2/F3)
 *   → [자음 트랜지언트] 음절 머리에 10~30ms 노이즈 버스트를 병렬 합류
 *   → [진폭 엔벨로프] attack/decay/release (클릭 방지)
 *   → [roughness AM] 25~55Hz 저주파 게인 LFO (링모듈레이션 유사)
 *   → [마스터] gain → WaveShaper 소프트 리미터 → Compressor → destination
 *
 * 주파수 대역
 *   BGM이 440Hz~6kHz를 비워 두므로 포먼트/버스트 대역을 그 안에 배치한다.
 *
 * 로드 방식
 *   일반 script 태그 로드가 1순위 계약이다. (`[일반 script 태그]`)
 *   따라서 `export` 키워드를 쓰지 않고 UMD 스타일 IIFE로 감싼다.
 *   window.Jellyer / module.exports / AMD 모두에 노출.
 *
 * 주의
 *   최상위에서 AudioContext를 만들지 않는다(자동재생 정책). init()에서 lazy 생성.
 * ===================================================================== */

(function (root, factory) {
  'use strict';
  var Jellyer = factory();

  // 1순위: 일반 script 로드 → 전역 노출
  if (typeof window !== 'undefined') window.Jellyer = Jellyer;
  if (typeof globalThis !== 'undefined') globalThis.Jellyer = Jellyer;
  else if (root) root.Jellyer = Jellyer;

  // 부가: CommonJS / AMD 번들러 호환 (ES `export`는 script 로드를 깨므로 쓰지 않음)
  if (typeof module !== 'undefined' && module.exports) module.exports = Jellyer;
  if (typeof define === 'function' && define.amd) define(function () { return Jellyer; });
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ===================================================================
   * 1. 모음 포먼트 표
   * -------------------------------------------------------------------
   * 한국어 단모음 5종의 F1/F2/F3 (성인 남성 기준값, 단위 Hz).
   * 이 값을 프로필의 formantShift(성도 길이 배율)와
   * f0 기반 보정으로 스케일해서 캐릭터별 음색을 만든다.
   * =================================================================== */
  var VOWELS = {
    '아': { f1: 730, f2: 1090, f3: 2440 },
    '에': { f1: 530, f2: 1840, f3: 2480 },
    '이': { f1: 270, f2: 2290, f3: 3010 },
    '오': { f1: 570, f2: 840,  f3: 2410 },
    '우': { f1: 300, f2: 870,  f3: 2240 }
  };
  var VOWEL_KEYS = ['아', '에', '이', '오', '우'];

  // 포먼트 f0 보정의 기준 f0 (위 표를 측정한 남성 화자의 대략적 기본 주파수)
  var FORMANT_REF_F0 = 130;

  /* ===================================================================
   * 2. 캐릭터 프로필 (총 8개)
   * -------------------------------------------------------------------
   * f0 기준선은 기존 런타임 juice.js VOICE_CHARS 값을 그대로 따른다.
   * (ten 178 / twin 205 / mungchi 268 / ppyak 352 / jelly 418)
   *
   * ※ 발주 지시서("텐텐=높고 통통, 트윈=낮고 느긋")와 기존 코드가 정반대라
   *    임의 봉합하지 않고 `-alt` 프로필로 양쪽 다 제공한다.
   *
   * 키 의미
   *   formantShift  성도 길이 배율. 1.0 = 성인 남성, >1 = 짧은 성도(아이/작은 몸)
   *   syllableMs    음절 1개의 발성 길이(ms)
   *   gapMs         음절 사이 무음(ms)
   *   vibratoDepth  f0 대비 비율(0.02 = ±2%)
   *   jitter        프레임 피치 흔들림 비율(0.02 = ±2%)
   *   roughness     걸걸함(저주파 AM + 서브하모닉 혼합량) 0~1
   *   breathiness   숨소리(노이즈) 혼합량 0~1
   *   vowelSet      선호 모음 시퀀스(순환 사용). 배열 순서가 곧 모음 도약 패턴
   *   endContour    문장 마지막 음절 억양 'up' | 'down' | 'flat'
   * =================================================================== */
  var PROFILES = {
    // --- 텐텐 왕자 (기존 코드 기준선: 178Hz, 차분한 형) --------------
    'ten': {
      id: 'ten', name: '텐텐 왕자',
      f0: 178, wave: 'saw', formantShift: 1.00,
      syllableMs: 105, gapMs: 30,
      vibratoHz: 5.0, vibratoDepth: 0.018, jitter: 0.012,
      roughness: 0.05, attackMs: 12,
      vowelSet: ['아', '오', '에', '아'],
      endContour: 'flat', breathiness: 0.12, gain: 1.00
    },

    // --- 텐텐 왕자 (지시서 기준: 높고 통통 튐, twin보다 높은 f0) -----
    'ten-alt': {
      id: 'ten-alt', name: '텐텐 왕자(밝은 버전)',
      f0: 225, wave: 'saw', formantShift: 1.08,
      syllableMs: 78, gapMs: 22,
      vibratoHz: 6.4, vibratoDepth: 0.030, jitter: 0.020,
      roughness: 0.03, attackMs: 8,
      vowelSet: ['이', '아', '에', '이'],
      endContour: 'up', breathiness: 0.14, gain: 0.96
    },

    // --- 트윈 왕자 (기존 코드 기준선: 205Hz = ten보다 2.5반음 위,
    //     말속도는 형보다 약 18% 빠름 → syllableMs/gapMs를 0.82배) ----
    'twin': {
      id: 'twin', name: '트윈 왕자',
      f0: 205, wave: 'saw', formantShift: 1.05,
      syllableMs: 86, gapMs: 25,
      vibratoHz: 5.6, vibratoDepth: 0.022, jitter: 0.016,
      roughness: 0.04, attackMs: 10,
      vowelSet: ['이', '아', '에'],
      endContour: 'up', breathiness: 0.14, gain: 0.98
    },

    // --- 트윈 왕자 (지시서 기준: 낮고 느긋) --------------------------
    'twin-alt': {
      id: 'twin-alt', name: '트윈 왕자(차분한 버전)',
      f0: 168, wave: 'saw', formantShift: 0.98,
      syllableMs: 132, gapMs: 38,
      vibratoHz: 4.2, vibratoDepth: 0.015, jitter: 0.010,
      roughness: 0.06, attackMs: 16,
      vowelSet: ['오', '아', '에', '오'],
      endContour: 'down', breathiness: 0.16, gain: 1.00
    },

    // --- 뭉치: 몽글몽글. 부드러운 triangle + 깊은 비브라토 ----------
    'mungchi': {
      id: 'mungchi', name: '뭉치',
      f0: 268, wave: 'triangle', formantShift: 1.06,
      syllableMs: 118, gapMs: 34,
      vibratoHz: 6.2, vibratoDepth: 0.055, jitter: 0.014,
      roughness: 0.03, attackMs: 18,
      vowelSet: ['오', '우', '아', '오'],
      endContour: 'flat', breathiness: 0.20, gain: 0.95
    },

    // --- 삐약: 삐약삐약 고음, 짧고 빠른 음절, 촐랑 -------------------
    'ppyak': {
      id: 'ppyak', name: '삐약',
      f0: 352, wave: 'saw', formantShift: 1.12,
      syllableMs: 68, gapMs: 18,
      vibratoHz: 7.5, vibratoDepth: 0.035, jitter: 0.030,
      roughness: 0.02, attackMs: 6,
      vowelSet: ['이', '아', '이', '에'],
      endContour: 'up', breathiness: 0.10, gain: 0.90
    },

    // --- 젤리공주: 반짝, 끝음 상행, /우/→/이/ 모음 도약 --------------
    'jelly': {
      id: 'jelly', name: '젤리공주',
      f0: 418, wave: 'triangle', formantShift: 1.18,
      syllableMs: 92, gapMs: 26,
      vibratoHz: 6.8, vibratoDepth: 0.040, jitter: 0.018,
      roughness: 0.02, attackMs: 10,
      vowelSet: ['우', '이', '우', '이'],
      endContour: 'up', breathiness: 0.22, gain: 0.88
    },

    // --- 먹깨비(보스): 신규 설계. 낮은 f0 + 높은 roughness,
    //     /오/우/ 위주로 우물우물, 느린 음절 -------------------------
    'mukkaebi': {
      id: 'mukkaebi', name: '먹깨비',
      f0: 128, wave: 'saw', formantShift: 0.90,
      syllableMs: 168, gapMs: 52,
      vibratoHz: 3.4, vibratoDepth: 0.020, jitter: 0.030,
      roughness: 0.75, attackMs: 26,
      vowelSet: ['오', '우', '오', '우'],
      endContour: 'down', breathiness: 0.28, gain: 1.00
    }
  };

  /* ===================================================================
   * 3. PARAM_META — 데모 페이지 슬라이더 UI 자동 생성용 메타
   * =================================================================== */
  var PARAM_META = {
    f0:           { min: 80,  max: 520, step: 1,     label: '기본 피치(Hz)' },
    wave:         { type: 'enum', options: ['saw', 'triangle', 'square', 'sine'], label: '성문 파형' },
    formantShift: { min: 0.7, max: 1.6, step: 0.01,  label: '포먼트 배율(성도 길이)' },
    syllableMs:   { min: 40,  max: 260, step: 1,     label: '음절 길이(ms)' },
    gapMs:        { min: 0,   max: 100, step: 1,     label: '음절 간격(ms)' },
    vibratoHz:    { min: 0,   max: 12,  step: 0.1,   label: '비브라토 속도(Hz)' },
    vibratoDepth: { min: 0,   max: 0.15,step: 0.001, label: '비브라토 깊이(f0 비율)' },
    jitter:       { min: 0,   max: 0.08,step: 0.001, label: '피치 지터(흔들림)' },
    roughness:    { min: 0,   max: 1,   step: 0.01,  label: '거칠기(걸걸함)' },
    attackMs:     { min: 2,   max: 60,  step: 1,     label: '어택(ms)' },
    vowelSet:     { type: 'vowels', options: VOWEL_KEYS, label: '모음 시퀀스' },
    endContour:   { type: 'enum', options: ['up', 'down', 'flat'], label: '문장 끝 억양' },
    breathiness:  { min: 0,   max: 0.6, step: 0.01,  label: '숨소리' },
    gain:         { min: 0,   max: 1.5, step: 0.01,  label: '프로필 볼륨' }
  };

  /* ===================================================================
   * 4. 티어(흥분도) 규칙 상수 — 발주 수치 그대로
   * =================================================================== */
  var TIER_SEMITONE_PER_STEP = 1.7;    // 단계당 피치 +1.7 반음
  var TIER_RATE_PER_STEP     = 0.045;  // 단계당 말속도 -4.5% (길이가 줄어 빨라짐)
  var TIER_VIB_PER_STEP      = 0.26;   // 단계당 비브라토 깊이 +26%
  var TIER_HIGH_THRESHOLD    = 5;      // tier >= 5 이면 마지막 음절 추가 상행
  var TIER_HIGH_EXTRA_ST     = 2.2;    // 그 추가 상행량(반음)

  var MAX_UTTERANCE_MS = 1000;         // 발화 전체 상한 (권장 ≤ 1.0초)

  /* ===================================================================
   * 5. 내부 상태
   * =================================================================== */
  var ctx = null;            // AudioContext
  var master = null;         // 마스터 게인
  var limiter = null;        // WaveShaper 소프트 리미터
  var comp = null;           // DynamicsCompressor
  var noiseBuf = null;       // 공용 화이트노이즈 버퍼
  var active = [];           // 재생 중인 발화 핸들 목록
  var inited = false;

  /* ------------------------- 유틸 ---------------------------------- */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function semitone(f, st) { return f * Math.pow(2, st / 12); }

  /** 소프트 클리핑 커브(tanh 근사) — 마스터 리미터용 */
  function makeSoftCurve(amount) {
    var n = 2048, curve = new Float32Array(n), k = amount || 2.2;
    for (var i = 0; i < n; i++) {
      var x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return curve;
  }

  /** 화이트노이즈 버퍼 (숨소리 + 자음 버스트 공용, 1회만 생성) */
  function getNoiseBuffer() {
    if (noiseBuf) return noiseBuf;
    var len = Math.floor(ctx.sampleRate * 1.0);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  /** WebAudio 파형 이름 매핑 ('saw'는 별칭) */
  function waveType(w) {
    if (w === 'saw' || w === 'sawtooth') return 'sawtooth';
    if (w === 'triangle' || w === 'square' || w === 'sine') return w;
    return 'sawtooth';
  }

  /* ===================================================================
   * 6. init — AudioContext 주입/lazy 생성, 재호출 안전
   * =================================================================== */
  function init(externalCtx) {
    if (externalCtx && externalCtx !== ctx) {
      // 외부 컨텍스트가 새로 주입되면 마스터 체인을 다시 만든다
      teardownMaster();
      ctx = externalCtx;
      inited = false;
    }
    if (!ctx) {
      var AC = (typeof window !== 'undefined') &&
               (window.AudioContext || window.webkitAudioContext);
      if (!AC) return null;              // WebAudio 미지원 환경 → 무음 동작
      ctx = new AC();
    }
    if (!inited) {
      // 마스터 체인: gain → soft limiter → compressor → destination
      master  = ctx.createGain();
      master.gain.value = 0.9;

      limiter = ctx.createWaveShaper();
      limiter.curve = makeSoftCurve(2.2);
      limiter.oversample = '2x';

      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 18;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;

      master.connect(limiter);
      limiter.connect(comp);
      comp.connect(ctx.destination);
      inited = true;
    }
    // 자동재생 정책 대응: suspended면 resume 시도
    if (ctx.state === 'suspended' && ctx.resume) {
      try { ctx.resume(); } catch (e) { /* 사용자 제스처 전이면 무시 */ }
    }
    return ctx;
  }

  function teardownMaster() {
    try { if (master) master.disconnect(); } catch (e) {}
    try { if (limiter) limiter.disconnect(); } catch (e) {}
    try { if (comp) comp.disconnect(); } catch (e) {}
    master = limiter = comp = null;
    noiseBuf = null;
  }

  /* ===================================================================
   * 7. 음절 수 산출
   * -------------------------------------------------------------------
   * 근거: 게임 보이스는 0.2~0.5초, 전체 상한 1.0초. 한글 대사를 1:1로
   * 읽으면 20음절짜리 대사가 2~3초가 되어 게임 템포를 망친다.
   * 그래서 "한글 음절 n → ceil(n/3)" 으로 3:1 압축하고 2~10으로 clamp한다.
   *  - 짧은 대사("좋아!" 2음절)는 최소 2음절 → 존재감 유지
   *  - 긴 대사(30음절)는 10음절에서 포화 → 길이 폭주 방지
   * 이후 총 길이가 1.0초를 넘으면 syllableMs/gapMs를 비례 축소해 맞춘다.
   * =================================================================== */
  function countSyllables(text) {
    if (!text) return 2;
    var s = String(text);
    var hangul = 0, other = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c >= 0xAC00 && c <= 0xD7A3) hangul++;                 // 완성형 한글 음절
      else if (c > 0x20 && !/[.,!?…~\-'"()\[\]]/.test(s[i])) other++; // 영문/숫자 등
    }
    // 한글이 없으면 비한글 글자 수를 대략 2:1로 음절 환산
    var n = hangul > 0 ? hangul : Math.ceil(other / 2);
    return clamp(Math.ceil(n / 3), 2, 10);
  }

  /* ===================================================================
   * 8. 프로필 해석 — 기본 프로필 + opts.profile 오버라이드 + 티어/속도
   * =================================================================== */
  function resolveProfile(charId, opts) {
    var base = PROFILES[charId] || PROFILES['ten'];
    var p = {};
    for (var k in base) if (Object.prototype.hasOwnProperty.call(base, k)) p[k] = base[k];

    // 슬라이더 값 즉시 반영용 오버라이드
    var ov = opts && opts.profile;
    if (ov) for (var k2 in ov) {
      if (Object.prototype.hasOwnProperty.call(ov, k2) && ov[k2] !== undefined && ov[k2] !== null) {
        p[k2] = ov[k2];
      }
    }

    var tier = clamp(Math.round((opts && opts.tier) || 1), 1, 6);
    var step = tier - 1;
    var rate = clamp((opts && opts.rate) || 1, 0.5, 2);

    // 티어 규칙 (발주 수치 그대로)
    p.f0 = semitone(p.f0, TIER_SEMITONE_PER_STEP * step);            // +1.7 반음/단계
    var rateMul = Math.pow(1 - TIER_RATE_PER_STEP, step);            // -4.5%/단계
    p.syllableMs = p.syllableMs * rateMul / rate;
    p.gapMs      = p.gapMs      * rateMul / rate;
    p.vibratoDepth = p.vibratoDepth * Math.pow(1 + TIER_VIB_PER_STEP, step); // +26%/단계

    p._tier = tier;
    p._extraEndUp = (tier >= TIER_HIGH_THRESHOLD) ? TIER_HIGH_EXTRA_ST : 0;

    // 안전 클램프
    p.f0 = clamp(p.f0, 60, 1200);
    p.syllableMs = clamp(p.syllableMs, 25, 400);
    p.gapMs = clamp(p.gapMs, 0, 200);
    p.vibratoDepth = clamp(p.vibratoDepth, 0, 0.4);
    p.jitter = clamp(p.jitter || 0, 0, 0.12);
    p.roughness = clamp(p.roughness || 0, 0, 1);
    p.breathiness = clamp(p.breathiness || 0, 0, 1);
    p.attackMs = clamp(p.attackMs || 10, 2, 80);
    p.formantShift = clamp(p.formantShift || 1, 0.6, 2);
    if (!p.vowelSet || !p.vowelSet.length) p.vowelSet = ['아', '이'];
    return p;
  }

  /* ===================================================================
   * 9. 포먼트 스케일 계산
   * -------------------------------------------------------------------
   * 포먼트는 성도 길이에 반비례한다. 캐릭터 f0가 높다 = 대체로 작은 몸/짧은
   * 성도 → 포먼트도 올라가야 자연스럽다. 다만 f0에 비례해 그대로 올리면
   * 도널드덕이 되므로 완만한 거듭제곱(0.33승)으로 눌러주고 상한을 둔다.
   * =================================================================== */
  function formantMultiplier(profile) {
    var ratio = Math.max(0.4, profile.f0 / FORMANT_REF_F0);
    var k = Math.pow(ratio, 0.33);        // 130Hz→1.0, 268→1.28, 418→1.48
    k = clamp(k, 0.85, 1.55);
    return k * profile.formantShift;
  }

  /* ===================================================================
   * 10. 포먼트 체인 생성 (peaking 3단 직렬)
   * -------------------------------------------------------------------
   * peaking 필터를 직렬로 걸어 F1/F2/F3 대역을 부스트한다.
   * BGM이 비워 둔 440Hz~6kHz 대역 안에서 포먼트가 움직이도록 클램프.
   * =================================================================== */
  function buildFormantChain(nodes, mult) {
    var nyq = ctx.sampleRate * 0.5;
    var specs = [
      { gain: 13, q: 6.5 },   // F1 — 모음의 개구도
      { gain: 11, q: 8.0 },   // F2 — 전설/후설(가장 변별력 큼)
      { gain: 7,  q: 9.0 }    // F3 — 광택/개성
    ];
    var filters = [];
    for (var i = 0; i < 3; i++) {
      var f = ctx.createBiquadFilter();
      f.type = 'peaking';
      f.Q.value = specs[i].q;
      f.gain.value = specs[i].gain;
      f.frequency.value = 500;
      filters.push(f);
      nodes.push(f);
      if (i > 0) filters[i - 1].connect(f);
    }
    // 톱니의 고역 쓴맛을 눌러 "젤리" 질감을 만드는 tilt 로우패스
    var tilt = ctx.createBiquadFilter();
    tilt.type = 'lowpass';
    tilt.frequency.value = clamp(6200 * Math.min(1.2, mult), 1500, nyq * 0.9);
    tilt.Q.value = 0.6;
    filters[2].connect(tilt);
    nodes.push(tilt);

    return { input: filters[0], output: tilt, filters: filters, nyq: nyq };
  }

  /** 포먼트 필터 주파수를 특정 모음으로 t초에 램프 */
  function setVowel(chain, vowelKey, mult, t, glideSec) {
    var v = VOWELS[vowelKey] || VOWELS['아'];
    var fs = [v.f1, v.f2, v.f3];
    for (var i = 0; i < 3; i++) {
      var target = clamp(fs[i] * mult, 90, chain.nyq * 0.92);
      var p = chain.filters[i].frequency;
      if (glideSec > 0) {
        p.setTargetAtTime(target, t, glideSec / 3);
      } else {
        p.setValueAtTime(target, t);
      }
    }
  }

  /* ===================================================================
   * 11. speak — 메인 발화
   * =================================================================== */
  function speak(charId, text, opts) {
    opts = opts || {};
    init();

    // 이전 발화 자동 중단 (중복 재생 방지)
    stop();

    var p = resolveProfile(charId, opts);
    var n = countSyllables(text);

    // --- 길이 예산: 총 길이가 1.0초를 넘으면 음절/간격을 비례 축소 ---
    var sylMs = p.syllableMs, gapMs = p.gapMs;
    var total = n * sylMs + (n - 1) * gapMs;
    if (total > MAX_UTTERANCE_MS) {
      var shrink = MAX_UTTERANCE_MS / total;
      sylMs *= shrink;
      gapMs *= shrink;
      total = MAX_UTTERANCE_MS;
    }

    // 음절 시작 시각(ms) — 데모가 자막을 톡톡 튀게 표시하는 데 사용
    var syllableTimes = [];
    for (var i = 0; i < n; i++) syllableTimes.push(Math.round(i * (sylMs + gapMs)));

    var handle = {
      syllables: n,
      durationMs: Math.round(total),
      syllableTimes: syllableTimes,
      _nodes: [],
      _timer: null,
      _stopped: false,
      stop: function () { stopHandle(this); }
    };

    // WebAudio가 없으면 타이밍 정보만 반환(자막은 그대로 동작)
    if (!ctx || !master) return handle;

    var mult = formantMultiplier(p);
    var vGain = clamp((p.gain === undefined ? 1 : p.gain) *
                      clamp(opts.gain === undefined ? 1 : opts.gain, 0, 2), 0, 2);
    var now = ctx.currentTime + 0.02;   // 스케줄링 여유

    // --- 음절 단위 피치 컨투어: 작은 랜덤 워크 + 캐릭터 성향 --------
    var walk = 0;
    var contour = [];
    for (var s = 0; s < n; s++) {
      walk += rand(-1.1, 1.1);                       // 랜덤 워크
      walk = clamp(walk, -3.5, 3.5);                 // 폭주 방지
      var st = walk;
      if (s === n - 1) {
        // 문장 마지막 음절: endContour + 티어 고흥분 가산
        if (p.endContour === 'up') st += 3.0;
        else if (p.endContour === 'down') st -= 3.0;
        st += p._extraEndUp;                          // tier>=5 추가 상행
      } else if (s === 0) {
        st += 0.6;                                    // 첫 음절 살짝 강세
      }
      contour.push(st);
    }

    var utterGain = ctx.createGain();
    utterGain.gain.value = vGain;
    utterGain.connect(master);
    handle._nodes.push(utterGain);

    for (var k = 0; k < n; k++) {
      scheduleSyllable(handle, p, {
        t0: now + syllableTimes[k] / 1000,
        durSec: sylMs / 1000,
        vowel: p.vowelSet[k % p.vowelSet.length],
        semis: contour[k],
        mult: mult,
        out: utterGain,
        isFirst: k === 0
      });
    }

    // --- 정리 타이머: 발화 종료 후 모든 노드 disconnect (누수 방지) --
    handle._timer = setTimeout(function () {
      cleanup(handle);
    }, total + 420);

    active.push(handle);
    return handle;
  }

  /* ===================================================================
   * 12. 음절 1개 스케줄링
   * -------------------------------------------------------------------
   * 성문 소스(+서브하모닉+숨소리) → 포먼트 체인 → 엔벨로프 → roughness AM
   * 그리고 머리에 10~30ms 노이즈 버스트(파열음 /ㅃ ㄸ ㄲ/ 느낌)를 얹는다.
   * =================================================================== */
  function scheduleSyllable(handle, p, o) {
    var N = handle._nodes;
    var t0 = o.t0;
    var dur = o.durSec;
    var f0 = semitone(p.f0, o.semis);

    /* ---- 포먼트 체인 ---- */
    var chain = buildFormantChain(N, o.mult);

    /* ---- 진폭 엔벨로프 (클릭 방지: 0에서 시작해 램프) ---- */
    var env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    var atk = Math.min(p.attackMs / 1000, dur * 0.45);
    env.gain.exponentialRampToValueAtTime(1.0, t0 + atk);
    env.gain.setTargetAtTime(0.72, t0 + atk, dur * 0.25);          // 부드러운 디케이
    var relStart = t0 + dur * 0.72;
    env.gain.setTargetAtTime(0.0001, relStart, dur * 0.16);        // 부드러운 릴리스
    N.push(env);

    /* ---- roughness: 25~55Hz 저주파 AM (링모듈레이션 유사) ---- */
    var rough = ctx.createGain();
    var rAmt = p.roughness * 0.5;                                   // 0~0.5
    rough.gain.value = 1 - rAmt;
    N.push(rough);
    if (p.roughness > 0.01) {
      var amLfo = ctx.createOscillator();
      amLfo.type = 'sine';
      amLfo.frequency.value = 25 + p.roughness * 30;                // 25~55Hz
      var amDepth = ctx.createGain();
      amDepth.gain.value = rAmt;
      amLfo.connect(amDepth);
      amDepth.connect(rough.gain);
      amLfo.start(t0);
      amLfo.stop(t0 + dur + 0.05);
      N.push(amLfo, amDepth);
    }

    chain.output.connect(env);
    env.connect(rough);
    rough.connect(o.out);

    /* ---- 모음 포먼트 설정 (음절 시작에 살짝 글라이드) ---- */
    setVowel(chain, o.vowel, o.mult, t0, dur * 0.3);

    /* ---- 성문 소스 오실레이터 ---- */
    var osc = ctx.createOscillator();
    osc.type = waveType(p.wave);
    var srcGain = ctx.createGain();
    srcGain.gain.value = 0.42;
    osc.connect(srcGain);
    srcGain.connect(chain.input);
    N.push(osc, srcGain);

    /* ---- 음절 내 피치 궤적: 시작 → 목표로 완만한 글라이드 ---- */
    var f0End = semitone(f0, (p.endContour === 'down' ? -0.5 : 0.4));
    osc.frequency.setValueAtTime(f0 * rand(0.985, 1.015), t0);
    osc.frequency.linearRampToValueAtTime(f0End, t0 + dur);

    /* ---- 피치 지터: 프레임(약 22ms)마다 ±jitter 로 미세 흔들기 ---- */
    if (p.jitter > 0.001) {
      var frame = 0.022, t = t0;
      while (t < t0 + dur) {
        osc.frequency.setValueAtTime(
          clamp(f0 * (1 + rand(-p.jitter, p.jitter)), 40, ctx.sampleRate * 0.45),
          t
        );
        t += frame;
      }
      // 지터로 setValueAtTime을 깔았으므로 마지막에 목표 피치로 다시 수렴
      osc.frequency.linearRampToValueAtTime(f0End, t0 + dur);
    }

    /* ---- 비브라토 LFO → f0 (Hz 단위 깊이 = f0 * vibratoDepth) ---- */
    if (p.vibratoHz > 0.05 && p.vibratoDepth > 0.0005) {
      var vib = ctx.createOscillator();
      vib.type = 'sine';

  /* ===================================================================
   * 13. 정지 / 정리

  function cleanup(handle) {
    if (handle._timer) { clearTimeout(handle._timer); handle._timer = null; }

    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      try { if (nd.stop) nd.stop(0); } catch (e) {}
      try { nd.disconnect(); } catch (e) {}

    if (idx >= 0) active.splice(idx, 1);

    if (!handle || handle._stopped) return;

          try {
            nd.gain.cancelScheduledValues(t);
            nd.gain.setValueAtTime(nd.gain.value, t);
            nd.gain.linearRampToValueAtTime(0.0001, t + 0.015);
          } catch (e) {}

  }

  /** 재생 중인 모든 발화 중단 */
  function stop() {

  }

   * 14. 공개 API
   * =================================================================== */
  var Jellyer = {
    init: init,
    speak: speak,
    stop: stop,
    PROFILES: PROFILES,
    PARAM_META: PARAM_META,
    VOWELS: VOWELS,
    VOWEL_KEYS: VOWEL_KEYS,
    /** 현재 AudioContext 조회(디버깅/데모용). 없으면 null */
    getContext: function () { return ctx; }
  };

  return Jellyer;
});

        var v = st.voice[cid] || null;
        yes.classList.toggle('on', v === 'ok');
        no.classList.toggle('on', v === 'no');
        db.style.display = v ? '' : 'none';
      }
      vs();
      vbox.appendChild(card);
    });
  }

  /* ================= result text ================= */
  function label(v) {
    if (!v) return null;
    if (v === 'keep') return '현행유지';
    if (v === 'reject') return '반려';
    return String(v).toUpperCase();
  }
  function update() {
    var picked = [], todo = [];
    M.slots.forEach(function (s) {
      var v = label(st.sfx[s.id]);
      if (v) picked.push(s.id + ': ' + v); else todo.push(s.id);
    });
    var vok = [], vno = [];
    Object.keys(st.voice).forEach(function (k) {
      if (st.voice[k] === 'ok') vok.push(k); else if (st.voice[k] === 'no') vno.push(k);
    });

    var L = [];
    L.push('[틴트윈 사운드 오디션 결과]');
    L.push('SFX ' + picked.length + '/' + M.slots.length + ' 판정');
    L.push('');
    L.push(picked.length ? picked.join(', ') : '(아직 판정 없음)');
    if (todo.length) { L.push(''); L.push('미판정 ' + todo.length + ': ' + todo.join(', ')); }
    if (vok.length) { L.push(''); L.push('젤리어 채택: ' + vok.join(', ')); }
    if (vno.length) { L.push('젤리어 반려: ' + vno.join(', ')); }
    $('#out').value = L.join('\n');
    $('#pdone').textContent = picked.length;
    if (filter === 'todo') applyFilter();
  }
  update();

  /* ---- copy ---- */
  $('#copy').addEventListener('click', function () {
    var b = this, txt = $('#out').value;
    function ok() { b.textContent = '복사됨 ✓'; b.classList.add('ok'); setTimeout(function () { b.textContent = '복사'; b.classList.remove('ok'); }, 1600); }
    function fallback() {
      var ta = $('#out');
      try {
        ta.removeAttribute('readonly');
        ta.focus(); ta.setSelectionRange(0, txt.length);
        var done = document.execCommand && document.execCommand('copy');
        ta.setAttribute('readonly', 'readonly');
        if (done) { ok(); return; }
      } catch (e) { try { ta.setAttribute('readonly', 'readonly'); } catch (e2) {} }
      toast('자동 복사 실패 — 위 칸을 길게 눌러 복사하세요');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok)['catch'](fallback);
    } else fallback();
  });

  $('#fab').addEventListener('click', function () { $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  $('#stopfab').addEventListener('click', stopAll);

  $('#foot').innerHTML = '외부 참조 0 · mp3 ' + Object.keys(MP3).length + '개 인라인 · 슬롯 ' + M.slots.length + ' · 후보 ' + NC + '<br>build ' + esc(BUILT_AT);

  window.__AUDIT = {
    slots: M.slots.length, cands: NC, files: Object.keys(MP3).length,
    synthSlots: Object.keys(SYNTH).length,
    profiles: Object.keys(VP).length,
    /* 헤드리스 검증 훅: 전 mp3를 실제 decodeAudioData 로 통과시켜 본다 */
    decodeAll: function () {
      return new Promise(function (res) {
        if (!ac()) { res({ error: 'no-audiocontext' }); return; }
        var keys = Object.keys(MP3), i = 0, ok = 0, bad = [], dur = 0;
        (function step() {
          if (i >= keys.length) { res({ total: keys.length, ok: ok, bad: bad, totalDurationSec: +dur.toFixed(3) }); return; }
          var k = keys[i++];
          decode(k, function (b) {
            if (b && b.length > 0) { ok++; dur += b.duration; } else bad.push(k);
            step();
          });
        })();
      });
    }
  };
})();
</script>
</body>
</html>
